[profile.release]
lto = "fat"
codegen-units = 1

[profile.release-with-debug]
inherits = "release"
debug = true
# Prioritize compile time over runtime performance
codegen-units = 16
lto = "thin"

[profile.release-no-lto]
inherits = "release"
debug = true
lto = false
# Prioritize compile time when LTO is not relevant to the measurement.
codegen-units = 16

[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 16

[target.x86_64-unknown-linux-gnu]
# The default target is haswell.  This is an old enough target
# that portability is high but a new enough target that we gain
# some of the most common SIMD optimizations.
#
# On certain paths we use explicit SIMD and runtime dispatch to
# opt-in to even higher CPU targets.  The target specified here
# is for all code that is NOT using explicit SIMD (still the large
# majority of code).
rustflags = ["-C", "target-cpu=haswell", "-C", "target-feature=+avx2,+fma,+f16c"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1", "-C", "target-feature=+neon,+fp16,+fhm,+dotprod"]
