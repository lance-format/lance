[default]
extend-ignore-re = ["(?Rm)^.*(#|//)\\s*spellchecker:disable-line$"]

[default.extend-words]
DNE = "DNE"
arange = "arange"
nd = "nd"
terrestial = "terrestial"
abd = "abd"
afe = "afe"
typ = "typ"
rabit = "rabit"
flate = "flate"
Ines = "Ines"
alph = "alph"
caf = "caf"

[default.expect]
nprobs = "nprobes"
nprob = "nprobe"

[files]
extend-exclude = [
    "notebooks/*.ipynb",
    "*_THIRD_PARTY_LICENSES.*",
    "rust/lance-file/test_data/exact_versions/*.lance",
    "rust/lance-tokenizer/src/stop_word_filter/stopwords.rs",
]
# If a line ends with # or // and has spellchecker:disable-line, ignore it
