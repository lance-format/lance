syntax = "proto3";

package lance.blob.reference;

import "snapshot.proto";

/* Execution-only protocol for transporting lazy blob values. This is not a
 * persisted Lance format. See docs/src/guide/blob_references.md for invariants.
 * All messages require protocol_version = 1; unknown versions must fail.
 */
message SourceContext {
  uint32 protocol_version = 1;
  // Required capabilities: 1 = object-range transport, 2 = immutable external objects.
  repeated uint32 required_capabilities = 2;
  // Removed unreleased fields embedded table identity and a full manifest.
  reserved 3 to 9;
  /* Portable key to an authenticated worker context that resolves storage
   * configuration, credentials, and per-base routing. It must work in every
   * participating process; a driver-local cache key or pointer is insufficient.
   */
  string access_context_key = 10;
  // Generic exact snapshot identity; never includes manifest contents.
  lance.snapshot.SnapshotRef snapshot = 11;
}

/* Lance-owned locator for one logical blob value. An object is a physical
 * storage container (for example a data file or packed blob file); several blobs
 * can occupy different ranges of the same object. Engines transport locators opaquely.
 */
message ObjectLocator {
  uint32 protocol_version = 1;
  /* Source binding fingerprint: BLAKE3 of the encoded, validated SourceContext.
   * Includes the snapshot reference, access_context_key, and required capabilities.
   * Distinct from the manifest digest and the separate snapshot identity fingerprint
   * computed by the Rust SnapshotRef::snapshot_id() API, without worker bindings.
   */
  bytes source_id = 2;
  string object_uri = 3;
  uint64 offset = 4;
  /* Absent means an unknown-length whole external object, requiring offset = 0.
   * Present zero means a valid empty blob.
   */
  optional uint64 length = 5;
  Origin origin = 6;
  /* Registered base in the source manifest, including inherited data-file bases.
   * Absent selects primary storage for Lance objects or the absolute URI's
   * storage binding for external objects. Present zero is a valid registered ID.
   */
  optional uint32 base_id = 7;

  enum Origin {
    UNSPECIFIED = 0;
    // Object contents are immutable under Lance's storage contract.
    LANCE = 1;
    // Requires capability 2 and the application's external immutability assumption.
    EXTERNAL_IMMUTABLE = 2;
  }
}

/* One self-contained exchange/spill message. arrow_ipc is one Arrow IPC stream
 * containing exactly one batch and one lance.blob.ref extension column.
 * source_context is a batch-local slot, not a persistent table identifier.
 */
message ReferenceBatch {
  uint32 protocol_version = 1;
  repeated SourceContext contexts = 2;
  bytes arrow_ipc = 3;
}

/* Capture of one Blob V2 leaf below structs/lists. references is an encoded
 * ReferenceBatch. indices_ipc contains one Arrow batch and one column preserving
 * the selected container path, list offsets, and nulls, with uint64 leaves that
 * index references. Null leaves denote SQL null; other struct fields are omitted.
 * This execution envelope does not change any persisted descriptor or locator.
 */
message NestedReferenceBatch {
  uint32 protocol_version = 1;
  bytes references = 2;
  bytes indices_ipc = 3;
}
