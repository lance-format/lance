syntax = "proto3";

import "file.proto";
import "table.proto";
import "google/protobuf/any.proto";

package lance.table;

/* A transaction represents the changes to a dataset.
 *
 * This has two purposes:
 * 1. When retrying a commit, the transaction can be used to re-build an updated
 *    manifest.
 * 2. When there's a conflict, this can be used to determine whether the other
 *    transaction is compatible with this one.
 */
message Transaction {
  /* The version of the dataset this transaction was built from.
   *
   * For example, for a delete transaction this means the version of the dataset
   * that was read from while evaluating the deletion predicate.
   */
  uint64 read_version = 1;

  // The UUID that unique identifies a transaction.
  string uuid = 2;

  // Optional version tag.
  string tag = 3;

  /* Optional properties for the transaction
   * __lance_commit_message is a reserved key
   */
  map<string, string> transaction_properties = 4;

  // Add new rows to the dataset.
  message Append {
    /* The new fragments to append.
     *
     * Fragment IDs are not yet assigned.
     */
    repeated DataFragment fragments = 1;
  }

  // Mark rows as deleted.
  message Delete {
    /* The fragments to update
     *
     * The fragment IDs will match existing fragments in the dataset.
     */
    repeated DataFragment updated_fragments = 1;
    // The fragments to delete entirely.
    repeated uint64 deleted_fragment_ids = 2;
    /* The predicate that was evaluated
     *
     * This may be used to determine whether the delete would have affected
     * files written by a concurrent transaction.
     */
    string predicate = 3;
  }

  // Create or overwrite the entire dataset.
  message Overwrite {
    /* The new fragments
     *
     * Fragment IDs are not yet assigned.
     */
    repeated DataFragment fragments = 1;
    // The new schema
    repeated lance.file.Field schema = 2;
    // Schema metadata.
    map<string, bytes> schema_metadata = 3;
    // Key-value pairs to merge with existing config.
    map<string, string> config_upsert_values = 4;
    // The base paths to be added for the initial dataset creation
    repeated BasePath initial_bases = 5;
  }

  /* Add or replace a new secondary index.
   *
   * This is also used to remove an index (we are replacing it with nothing)
   *
   * - new_indices: the modified indices, empty if dropping indices only
   * - removed_indices: the indices that are being replaced
   */
  message CreateIndex {
    repeated IndexMetadata new_indices = 1;
    repeated IndexMetadata removed_indices = 2;
  }

  /* An operation that rewrites but does not change the data in the table. These
   * kinds of operations just rearrange data.
   */
  message Rewrite {
    /* The old fragments that are being replaced
     *
     * DEPRECATED: use groups instead.
     *
     * These should all have existing fragment IDs.
     */
    repeated DataFragment old_fragments = 1;
    /* The new fragments
     *
     * DEPRECATED: use groups instead.
     *
     * These fragments IDs are not yet assigned.
     */
    repeated DataFragment new_fragments = 2;

    /* During a rewrite an index may be rewritten.  We only serialize the UUID
     * since a rewrite should not change the other index parameters.
     */
    message RewrittenIndex {
      // The id of the index that will be replaced
      UUID old_id = 1;
      // the id of the new index
      UUID new_id = 2;
      // the new index details
      google.protobuf.Any new_index_details = 3;
      // the version of the new index
      uint32 new_index_version = 4;
      /* Files in the new index with their sizes.
       * Empty if file sizes are not available (e.g. older writers).
       */
      repeated IndexFile new_index_files = 5;
    }

    // A group of rewrite files that are all part of the same rewrite.
    message RewriteGroup {
      /* The old fragment that is being replaced
       *
       * This should have an existing fragment ID.
       */
      repeated DataFragment old_fragments = 1;
      /* The new fragment
       *
       * The ID should have been reserved by an earlier
       * reserve operation
       */
      repeated DataFragment new_fragments = 2;
    }

    // Groups of files that have been rewritten
    repeated RewriteGroup groups = 3;
    // Indices that have been rewritten
    repeated RewrittenIndex rewritten_indices = 4;
  }

  // An operation that merges in a new column, altering the schema.
  message Merge {
    /* The updated fragments
     *
     * These should all have existing fragment IDs.
     */
    repeated DataFragment fragments = 1;
    // The new schema
    repeated lance.file.Field schema = 2;
    // Schema metadata.
    map<string, bytes> schema_metadata = 3;
    /* Set when this merge makes no nullability-affecting schema change: it
     * introduces no field that data staged against an earlier schema could
     * not safely omit. Without the assertion (including transactions written
     * before this field existed) the merge conservatively conflicts with
     * concurrent value-writes, which can only cause a retry.
     */
    bool preserves_nullability = 4;
  }

  // An operation that projects a subset of columns, altering the schema.
  message Project {
    // The new schema
    repeated lance.file.Field schema = 1;
    /* Set when this projection makes no nullability-affecting schema change,
     * as a rename or a drop does not. Without the assertion (including
     * transactions written before this field existed) the projection
     * conservatively conflicts with concurrent value-writes, which can only
     * cause a retry. A nullability tightening must not set this.
     */
    bool preserves_nullability = 2;
  }

  // An operation that restores a dataset to a previous version.
  message Restore {
    // The version to restore to
    uint64 version = 1;
  }

  /* An operation that reserves fragment ids for future use in
   * a rewrite operation.
   */
  message ReserveFragments {
    uint32 num_fragments = 1;
  }

  // An operation that clones a dataset.
  message Clone {
    /* - true:  Performs a metadata-only clone (copies manifest without data files).
     *          The cloned dataset references original data through `base_paths`,
     *          suitable for experimental scenarios or rapid metadata migration.
     * - false: Performs a full deep clone using the underlying object storage's native
     *          copy API (e.g., S3 CopyObject, GCS rewrite). This leverages server-side
     *          bulk copy operations to bypass download/upload bottlenecks, achieving
     *          near-linear speedup for large datasets (typically 3-10x faster than
     *          manual file transfers). The operation maintains atomicity and data
     *          integrity guarantees provided by the storage backend.
     */
    bool is_shallow = 1;
    /* the reference name in the source dataset
     * in most cases it should be the branch or tag name in the source dataset
     */
    optional string ref_name = 2;
    // the version of the source dataset for cloning
    uint64 ref_version = 3;
    // the absolute base path of the source dataset for cloning
    string ref_path = 4;
    // if the target dataset is a branch, this is the branch name of the target dataset
    optional string branch_name = 5;
  }
  
  /* Exact set of key hashes for conflict detection.
   * Used when the number of inserted rows is small.
   */
  message ExactKeySetFilter {
    // 64-bit hashes of the inserted row keys.
    repeated uint64 key_hashes = 1;
  }

  /* Bloom filter for key existence tests.
   * Used when the number of rows is large.
   */
  message BloomFilter {
    // Bitset backing the bloom filter (SBBF format).
    bytes bitmap = 1;
    // Number of bits in the bitmap.
    uint32 num_bits = 2;
    /* Number of items the filter was sized for.
     * Used for intersection validation (filters with different sizes cannot be compared).
     * Default: 8192
     */
    uint64 number_of_items = 3;
    /* False positive probability the filter was sized for.
     * Used for intersection validation (filters with different parameters cannot be compared).
     * Default: 0.00057
     */
    double probability = 4;
  }

  /* A filter for checking key existence in set of rows inserted by a merge insert operation.
   * Only created when the merge insert's ON columns match the schema's unenforced primary key.
   * The presence of this filter indicates strict primary key conflict detection should be used.
   * Can use either an exact set (for small row counts) or a Bloom filter (for large row counts).
   */
  message KeyExistenceFilter {
    // Field IDs of columns participating in the key (must match unenforced primary key).
    repeated int32 field_ids = 1;
    // The underlying data structure storing the key hashes.
    oneof data {
      // Exact set of key hashes (used for small number of rows).
      ExactKeySetFilter exact = 2;
      // Bloom filter (used for large number of rows).
      BloomFilter bloom = 3;
    }
  }

  // Serialized as sorted distinct local physical row offsets within the fragment (0-based).
  message UInt32List {
    repeated uint32 values = 1;
  }

  // An operation that updates rows but does not add or remove rows.
  message Update {
    /* The fragments that have been removed. These are fragments where all rows
     * have been updated and moved to a new fragment.
     */
    repeated uint64 removed_fragment_ids = 1;
    // The fragments that have been updated.
    repeated DataFragment updated_fragments = 2;
    // The new fragments where updated rows have been moved to.
    repeated DataFragment new_fragments = 3;
    // The ids of the fields that have been modified.
    repeated uint32 fields_modified = 4;
    /// SSTables to mark as compacted after this transaction.
    repeated CompactedSsTable compacted_sstables = 5;
    /* The fields that used to judge whether to preserve the new frag's id into
     * the frag bitmap of the specified indices.
     */
    repeated uint32 fields_for_preserving_frag_bitmap = 6;
    // The mode of update
    UpdateMode update_mode = 7;
    /* Filter for checking existence of keys in newly inserted rows, used for conflict detection.
     * Only tracks keys from INSERT operations during merge insert, not updates.
     */
    optional KeyExistenceFilter inserted_rows = 8;
    /* Per-fragment physical row offsets that matched an update_columns hash join (RewriteColumns).
     * Deprecated: use updated_fragment_offset_bitmaps (field 10) instead.
     */
    map<uint64, UInt32List> updated_fragment_offsets = 9;
    /* Per-fragment matched offsets as portable RoaringBitmap bytes (replaces field 9).
     * Writers emit field 10 only. Readers prefer field 10; fall back to field 9 for
     * manifests written before this change.
     */
    map<uint64, bytes> updated_fragment_offset_bitmaps = 10;
    /* The `dir_id` of the MemWAL `compacted_sstables` belongs to; required
     * when `compacted_sstables` is non-empty. See UpdateMemWalState.dir_id.
     */
    optional string mem_wal_dir_id = 11;
  }

  // The mode of update operation
  enum UpdateMode {

    /* rows are deleted in current fragments and rewritten in new fragments.
     * This is most optimal when the majority of columns are being rewritten
     * or only a few rows are being updated.
     */
    REWRITE_ROWS = 0;

    /* within each fragment, columns are fully rewritten and inserted as new data files.
     * Old versions of columns are tombstoned. This is most optimal when most rows are affected
     * but a small subset of columns are affected.
     */
    REWRITE_COLUMNS = 1;
  }

  // An entry for a map update. If value is not set, the key will be removed from the map.
  message UpdateMapEntry {
    // The key of the map entry to update.
    string key = 1;
    // The value to set for the key.
    optional string value = 2;
  }

  message UpdateMap {
    repeated UpdateMapEntry update_entries = 1;
    /* If true, the map will be replaced entirely with the new entries.
     * If false, the new entries will be merged with the existing map.
     */
    bool replace = 2;
  }
  
  /* An operation that updates the table config, table metadata, schema metadata,
   * or field metadata.
   */
  message UpdateConfig {
    UpdateMap config_updates = 6;
    UpdateMap table_metadata_updates = 7;
    UpdateMap schema_metadata_updates = 8;
    map<int32, UpdateMap> field_metadata_updates = 9;

    // Deprecated -------------------------------
    map<string, string> upsert_values = 1;
    repeated string delete_keys = 2;
    map<string, string> schema_metadata = 3;
    map<uint32, FieldMetadataUpdate> field_metadata = 4;

    message FieldMetadataUpdate {
      map<string, string> metadata = 5;
    }
  }

  message DataReplacementGroup {
    uint64 fragment_id = 1;
    DataFile new_file = 2;
  }

  // An operation that replaces the data in a region of the table with new data.
  message DataReplacement {
    /* A fragment can be the target of several groups, one per new file. The
     * groups apply in order, each to the fragment as the previous ones left it.
     */
    repeated DataReplacementGroup replacements = 1;
    /* Whether the new files change any value. Absent means true, which is what
     * a writer that predates this field meant. False means the values were only
     * moved to new files: index coverage, overlays, and row update versions are
     * left as they are.
     */
    optional bool data_change = 2;
  }

  /* Overlay files to append to a single fragment, in order (the last entry is
   * newest). The overlays are appended to the fragment's existing `overlays`
   * list; they do not replace it, so overlays written by concurrent commits are
   * preserved.
   */
  message DataOverlayGroup {
    uint64 fragment_id = 1;
    /* Each DataOverlayFile.committed_version is left 0 by the writer and stamped
     * to the new dataset version at commit time (re-stamped on retry), in the
     * same way as the created-at / last-updated-at version sequences. The fields
     * touched are read from each overlay's `data_file.fields`.
     */
    repeated DataOverlayFile overlays = 2;
  }

  /* Attach overlay files to fragments, supplying new values for a subset of
   * (row offset, field) cells without rewriting the fragments' base data files.
   * See the DataOverlayFile message in table.proto for resolution, coverage, and
   * versioning rules, and the Data Overlay Files and Transactions specifications
   * for the (intentionally permissive) conflict semantics.
   */
  message DataOverlay {
    repeated DataOverlayGroup groups = 1;
  }

  /* Update SSTable compaction progress in the MemWAL index.
   * This operation is used during merge-insert to atomically record which
   * SSTables have been compacted into the base table.
   */
  message UpdateMemWalState {
    // SSTables being marked as compacted.
    repeated CompactedSsTable compacted_sstables = 1;
    /* The `dir_id` of the MemWAL this update was built for. The commit is
     * rejected unless the manifest it builds on carries that MemWAL.
     */
    string dir_id = 2;
  }

  // An operation that updates base paths in the dataset.
  message UpdateBases {
    // The new base paths to add to the manifest.
    repeated BasePath new_bases = 1;
  }

  // ==========================================================================
  // Action-based transactions (Transaction V2) — DRAFT (OSS-1530).
  //
  // A `UserOperation` replaces the single legacy `Operation` with an ordered
  // list of granular `Action`s that commit atomically as one manifest change.
  // Actions are *deltas* (the change to the manifest), not post-images, which is
  // what makes compound commits and branch merge fall out uniformly. See the
  // design principles in OSS-1530.
  //
  // STATUS: this is the wire draft for the OSS-1529 spike and the OSS-757 PMC
  // vote. The messages and field numbers below are NOT yet a stable contract.
  // Current library support is READ-side fail-closed only: a transaction
  // carrying a `UserOperation` is rejected on load, and there is no write path.
  // `apply`, translation, and conflict resolution are intentionally absent.
  //
  // The schema is designed to be additive-safe (principle 9): message
  // identities and the core mutation fields are pinned; anything discovered
  // during implementation should arrive as an *added* optional field. Two
  // classes of information deliberately stay off the wire: computed conflict
  // *footprints* (a pure function of each action, principle 7) and large
  // derivable row-level deltas (e.g. a deletion's affected rows, an update's
  // matched offsets) — both are recomputed at conflict time, not serialized.
  // ==========================================================================

  // A reference to a counter-allocated identifier (field id, fragment id, or
  // base id), which may not be committed yet.
  //
  // `committed` is an already-assigned id. `local` is a placeholder token minted
  // by an `Add*` action earlier in the same `UserOperation`; it resolves to a
  // freshly-allocated committed id at apply time, and re-resolves against the
  // *target's* counters on merge/rebase (this is what lets two independent
  // `AddField`s on divergent branches become two distinct fields). `local`
  // tokens are scoped to a single `UserOperation` and must be distinct within it
  // (validated by the writer once the write path exists).
  message Ref {
    oneof kind {
      uint64 committed = 1;
      uint32 local = 2;
    }
  }

  // A user-facing, composable transaction: an ordered list of user actions that
  // commit atomically as a single manifest change.
  message UserOperation {
    // Human-readable description, e.g. "INSERT INTO t VALUES (1)".
    string description = 1;
    // Unique identifier for this operation (matches Transaction.uuid semantics).
    string uuid = 2;
    // The dataset version this operation was planned against.
    uint64 read_version = 3;
    // The ordered list of user actions applied by this operation.
    repeated UserAction actions = 4;
  }

  // A single user-recognizable step within a UserOperation (e.g. "append batch",
  // "rebuild index"), carrying a description and the granular actions it expands
  // to. The description keeps the transaction history human-readable; when a
  // range of transactions is squashed, each original UserOperation collapses
  // into one UserAction so the readable sequence survives. Action lists are
  // flattened when applied to the manifest.
  message UserAction {
    // Human-readable description of this step.
    string description = 1;
    // The granular manifest changes this step expands to.
    repeated Action actions = 2;
  }

  // A single granular change (a *delta*) or assertion. Legacy operations
  // decompose into an ordered list of these.
  //
  // TODO(OSS-1529): the `data_change` markers below are drafted per-action (for
  // maximum flexibility); the spike should validate per-action vs. per-UserAction
  // granularity before the vote.
  message Action {
    oneof action {
      // --- Minting actions (allocate a new counter-based id via a Local token)
      AddFragment add_fragment = 1;
      AddField add_field = 3;
      AddBase add_base = 4;
      // --- Fragment / data-file deltas
      AddDataFile add_data_file = 2;
      TombstoneFieldData tombstone_field_data = 5;
      RemoveFragment remove_fragment = 6;
      // --- Reference-stable changes (committed coordinates; post-image at rest)
      SetDeletionFile set_deletion_file = 7;
      ConfigUpdate config_update = 8;
      AddOverlays add_overlays = 9;
      RefreshRowVersionMetadata refresh_row_version_metadata = 10;
      UpdateMergedGenerations update_merged_generations = 11;
      // --- Schema (field-level; no wholesale SetSchema)
      DropField drop_field = 12;
      AlterField alter_field = 13;
      // --- Index segments (segment = UUID; a logical index = the segments that
      //     share a `name`; per-segment config duplication is a pre-existing
      //     limitation this project does not fix)
      AddIndexSegment add_index_segment = 14;
      RemoveIndexSegment remove_index_segment = 15;
      AdjustIndexCoverage adjust_index_coverage = 16;
      // --- Wholesale-within-operation
      ResetTable reset_table = 17;
      ReserveFragmentIds reserve_fragment_ids = 18;
      // --- Assertions (preconditions, not deltas)
      AssertUniqueKeys assert_unique_keys = 19;
    }
  }

  // Mint a new, empty fragment. Its data files arrive via AddDataFile actions
  // referencing this fragment's `local` token; its deletion vector (if any) via
  // SetDeletionFile.
  message AddFragment {
    // Placeholder token for the fragment id, resolved to a committed id at apply.
    uint32 local = 1;
    // Number of physical rows (including rows later tombstoned).
    uint64 physical_rows = 2;
    // Stable-row-id and row-version sequences, carried exactly as on
    // DataFragment. Absent on datasets without stable row ids.
    oneof row_id_sequence {
      bytes inline_row_ids = 3;
      ExternalFile external_row_ids = 4;
    }
    oneof last_updated_at_version_sequence {
      bytes inline_last_updated_at_versions = 5;
      ExternalFile external_last_updated_at_versions = 6;
    }
    oneof created_at_version_sequence {
      bytes inline_created_at_versions = 7;
      ExternalFile external_created_at_versions = 8;
    }
    // false => rearrangement only (rows unchanged, e.g. compaction); CDC and
    // streaming consumers may skip it. Absent is treated as true (real change).
    optional bool data_change = 9;
  }

  // Add a data file to a fragment.
  message AddDataFile {
    // The fragment to add the file to (Committed, or a same-op Local fragment).
    Ref fragment = 1;
    // The data file. Its `fields` are ignored/left unset (-1) and stamped in at
    // apply once `field_ids` resolve; the authority for the column->field
    // mapping is `field_ids` below.
    DataFile file = 2;
    // One entry per column in `file`, in order. Committed for existing fields,
    // Local for fields minted by an AddField in the same operation.
    repeated Ref field_ids = 3;
    optional bool data_change = 4;
  }

  // Mint a new schema field. A struct/list column that introduces several fields
  // is expressed as several ordered AddField actions (parent before children,
  // children referencing the parent via a Local ref).
  message AddField {
    // Placeholder token for the new field id, resolved at apply.
    uint32 local = 1;
    // The parent field (Committed for reparenting under an existing field, Local
    // for a sibling minted in the same operation). Absent => top-level column.
    optional Ref parent = 2;
    // Field definition; its `id` and `parent_id` are ignored (see `local`,
    // `parent`).
    lance.file.Field def = 3;
  }

  // Mint a new base path.
  message AddBase {
    // Placeholder token for the base id, resolved at apply.
    uint32 local = 1;
    // Base path; its `id` is ignored and stamped in at apply.
    BasePath base = 2;
  }

  // Tombstone the data-file binding of one or more committed fields: their slot
  // in whatever data file currently backs them is set to -2, and any file left
  // with no live fields is pruned at apply. This is how a column's data is
  // dropped or superseded (data files have no id of their own; a live field is
  // backed by exactly one file). A column re-encode is TombstoneFieldData(X)
  // followed by AddDataFile(new file, field X).
  message TombstoneFieldData {
    Ref fragment = 1;
    // Committed field ids whose current backing is tombstoned.
    repeated uint64 field_ids = 2;
    optional bool data_change = 3;
  }

  // Remove a fragment entirely (all rows deleted, or replaced by compaction).
  message RemoveFragment {
    Ref fragment = 1;
    optional bool data_change = 2;
  }

  // Set (replace) a fragment's deletion file. Reference-stable: the fragment id
  // is committed and physical row offsets are stable, so the post-image deletion
  // file is safe to store; the newly-deleted rows (the delta used for rebase and
  // conflict) are derived by diffing against the read-version deletion file and
  // are NOT serialized here.
  message SetDeletionFile {
    uint64 fragment = 1;
    DeletionFile deletion_file = 2;
    optional bool data_change = 3;
  }

  // Apply config / metadata updates. Reference-stable key-merges over stable
  // coordinates (config keys, field ids). Mirrors the new-style fields of the
  // legacy UpdateConfig operation.
  message ConfigUpdate {
    optional UpdateMap config = 1;
    optional UpdateMap table_metadata = 2;
    optional UpdateMap schema_metadata = 3;
    // Per-field metadata updates. Keyed by Ref so a field minted in the same
    // operation (Local) can receive metadata.
    repeated FieldMetadata field_metadata = 4;

    message FieldMetadata {
      Ref field = 1;
      UpdateMap updates = 2;
    }
  }

  // Append overlay files to fragments (see DataOverlayFile in table.proto).
  // Reference-stable: overlays target committed fragments/offsets/fields and are
  // appended, never replacing existing overlays.
  message AddOverlays {
    Ref fragment = 1;
    repeated DataOverlayFile overlays = 2;
    optional bool data_change = 3;
  }

  // Refresh row-version (created-at / last-updated-at) metadata for fragments
  // whose columns were merged in place, mirroring the implicit refresh Merge
  // performs on stable-row-id datasets.
  message RefreshRowVersionMetadata {
    repeated uint64 fragment_ids = 1;
  }

  // Mark MemWAL shard generations as merged. Covers UpdateMemWalState and the
  // merged-generations bookkeeping of Update.
  message UpdateMergedGenerations {
    repeated MergedGeneration merged_generations = 1;
  }

  // Remove a field from the schema (and, at apply, prune any data file left with
  // no live fields). References an existing committed field id.
  message DropField {
    uint64 field = 1;
  }

  // Alter facets of an existing field in place, preserving its identity (id).
  // Each facet is optional: present means "change this facet", absent means
  // "leave unchanged". Keying conflict on (field id, facet) lets independent
  // facet changes to the same field commute (e.g. a cast concurrent with a
  // nullability change). A cast additionally needs TombstoneFieldData + a new
  // AddDataFile to rewrite the data. New facets are added as optional fields.
  message AlterField {
    uint64 field = 1;
    optional string name = 2;
    // New Arrow logical type (see Field.logical_type). The cast.
    optional string logical_type = 3;
    optional bool nullable = 4;
  }

  // Add an index segment. A brand-new index is expressed as its first segment.
  // The set of segments sharing `name` constitutes one logical index.
  message AddIndexSegment {
    UUID uuid = 1;
    string name = 2;
    // Indexed field ids (Committed, or Local for same-op minted fields).
    repeated Ref fields = 3;
    google.protobuf.Any index_details = 4;
    optional int32 index_version = 5;
    // Fragments covered by this segment (resolved to a fragment_bitmap at apply,
    // and remapped under fragment relocation). Committed or same-op Local.
    repeated Ref covered_fragments = 6;
    // Index files with sizes, when produced by the writer (e.g. a compaction
    // that rewrites the segment). Empty when unavailable.
    repeated IndexFile files = 7;
    optional bool data_change = 8;
  }

  // Remove an index segment by uuid.
  message RemoveIndexSegment {
    UUID uuid = 1;
    optional bool data_change = 2;
  }

  // Adjust the fragment coverage of an existing index segment without rewriting
  // it. NOTE: coverage representation is the acknowledged-open area of OSS-1530;
  // this shape is provisional pending the OSS-1529 spike (which will settle how
  // much coverage change is derivable from fragment relocation vs. stated here).
  message AdjustIndexCoverage {
    UUID uuid = 1;
    repeated Ref add = 2;
    repeated uint64 remove = 3;
  }

  // Reset the table to an empty state, in preparation for a fresh schema and
  // data written by later actions in the same operation (the decomposition of a
  // full Overwrite / CREATE OR REPLACE). Drops the entire schema, schema
  // metadata, all fragments, and all indices; preserves table config, table
  // metadata, and base paths (change those via ConfigUpdate / AddBase in the
  // same operation). Its write footprint spans the whole schema, all fragments,
  // and all indices, so it conflicts with any concurrent change to them
  // (DROP TABLE-style exclusivity).
  message ResetTable {}

  // Reserve a contiguous range of fragment ids from the counter, for a later
  // (possibly distributed) writer to populate. Fragments written against a
  // reserved range reference those ids as Committed.
  message ReserveFragmentIds {
    uint32 count = 1;
  }

  // An assertion (precondition), not a delta: the keys this operation inserts
  // must not collide with keys inserted by a concurrent commit. Carries a bloom
  // / exact-set filter of the inserted key hashes (not derivable from any
  // post-image); conflict = the two filters intersect. Home for merge-insert's
  // strict primary-key conflict detection.
  message AssertUniqueKeys {
    // Field ids of the key columns (unenforced primary key). Committed, or Local
    // for same-op minted fields.
    repeated Ref key_fields = 1;
    KeyExistenceFilter filter = 2;
  }

  /* The operation of this transaction.
   *
   * Field numbers 100-199 are reserved for operations. A reader that sees a
   * number in this range it does not recognize is looking at an operation from
   * a newer writer, and must treat it as unknown rather than fail.
   */
  oneof operation {
    Append append = 100;
    Delete delete = 101;
    Overwrite overwrite = 102;
    CreateIndex create_index = 103;
    Rewrite rewrite = 104;
    Merge merge = 105;
    Restore restore = 106;
    ReserveFragments reserve_fragments = 107;
    Update update = 108;
    Project project = 109;
    UpdateConfig update_config = 110;
    DataReplacement data_replacement = 111;
    UpdateMemWalState update_mem_wal_state = 112;
    Clone clone = 113;
    UpdateBases update_bases = 114;
    DataOverlay data_overlay = 115;
    // Action-based transaction (Transaction V2). See UserOperation above.
    // DRAFT: currently rejected on load; no write path.
    UserOperation user_operation = 116;
  }

  // Fields 200/202 (`blob_append` / `blob_overwrite`) previously represented blob dataset ops.
  reserved 200, 202;
  reserved "blob_append", "blob_overwrite";
}
