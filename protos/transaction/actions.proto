syntax = "proto3";

import "file.proto";
import "table.proto";
import "transaction/common.proto";
import "google/protobuf/any.proto";

package lance.table;

/*
 * Action-based transactions (Transaction V2) — DRAFT.
 *
 * A `CompositeOperation` replaces the single legacy `Operation` (see
 * transaction.proto) with an ordered list of granular `Action`s that commit
 * atomically as one manifest change. This file is the wire draft only.
 *
 * STATUS
 * ------
 * The messages and field numbers here are NOT yet a stable contract. Library
 * support is read-side fail-closed only: a transaction carrying a
 * `CompositeOperation` is rejected on load, and there is no write path. Apply,
 * id translation, and conflict resolution are intentionally absent.
 *
 * DESIGN RATIONALE
 * ----------------
 * The reasoning below is the durable record of why the wire format is shaped
 * this way; it is deliberately kept in-tree rather than in an external tracker.
 *
 * 1. Actions are deltas, not post-images. Each action records *the change* to
 *    the manifest (add this file, tombstone this field), not the resulting
 *    state. Deltas are what make two things fall out uniformly with no special
 *    cases: composing several actions into one atomic commit, and merging or
 *    rebasing a branch (replay the deltas against the target). A few actions
 *    that carry non-derivable preconditions are the exception (see 8).
 *
 * 2. Minting vs. reference-stable actions. Minting actions allocate a new
 *    counter-based id (a field id, fragment id, or base id). Because the final
 *    id is not known until commit — and differs when the same action is
 *    replayed onto a different target during merge/rebase — a minting action
 *    names its new id with a `Local` token (see `Ref`) rather than a concrete
 *    value. Reference-stable actions touch already-committed ids at stable
 *    coordinates (a fragment's deletion vector, a config key); their target is
 *    unambiguous, so they may safely carry a post-image at rest.
 *
 * 3. One reference type, `Ref = Committed | Local`. `Committed` is a concrete,
 *    already-assigned id. `Local` is a placeholder minted by an earlier `Add*`
 *    action in the same operation. `Local` resolves to a freshly-allocated
 *    committed id at apply time, and re-resolves against the *target's*
 *    counters on merge/rebase — which is exactly what lets two independent
 *    `AddField`s on divergent branches become two distinct fields on merge.
 *
 * 4. Relocation by counter watermark. When an operation is replayed onto a
 *    newer version, minting actions are re-applied against the target's
 *    counters and their `Local` refs re-resolve; ids assigned above the
 *    read-version watermark are known to be freshly minted and are rewritten
 *    consistently across every action that referenced them.
 *
 * 5. Field-level schema. Schema changes are expressed per field
 *    (`AddField` / `DropField` / `AlterField`), never as a wholesale
 *    replacement, so concurrent schema edits to disjoint fields commute.
 *
 * 6. Identity-preserving `AlterField`. Altering a field is distinct from
 *    dropping it and adding a new one: the field keeps its id. Each mutable
 *    facet (name, type, nullability) is an independent optional, so two
 *    concurrent alters of *different* facets of the same field commute
 *    (e.g. a widening cast alongside a non-null -> nullable relaxation).
 *
 * 7. Index segments, not indices. The format has no first-class "index"
 *    separate from its segments; a new index is written as its first segment,
 *    and a logical index is the set of segments sharing a `name`. The actions
 *    mirror that: add/remove/adjust operate on a segment (by UUID). The
 *    resulting per-segment config duplication is a pre-existing limitation this
 *    draft does not attempt to fix.
 *
 * 8. Assertions carry only non-derivable preconditions. Most conflict checks
 *    are computed from the actions themselves. The exception is a fact that
 *    cannot be reconstructed from any post-image — e.g. the set of keys a
 *    merge-insert inserted — which is carried explicitly as an assertion
 *    (`AssertUniqueKeys`) and checked against concurrent commits.
 *
 * WHAT STAYS OFF THE WIRE
 * -----------------------
 * Two classes of information are deliberately not serialized, and are
 * recomputed at conflict time instead:
 *   - Conflict *footprints* (which fields/fragments/keys an action touches).
 *     These are a pure function of each action, so storing them would only risk
 *     drift.
 *   - Large derivable row-level deltas, e.g. a deletion's affected rows or an
 *     update's matched row offsets. These can be recomputed by diffing against
 *     the read-version state, and serializing them would bloat transactions
 *     with potentially huge integer lists.
 *
 * ADDITIVE-SAFETY
 * ---------------
 * The schema is meant to evolve additively: message identities and the core
 * mutation fields are pinned, and anything discovered during implementation
 * should arrive as an *added* optional field rather than a reshaping of what is
 * here.
 */

/*
 * A reference to a counter-allocated identifier (field id, fragment id, or base
 * id) that may not be committed yet.
 *
 * `committed` is an already-assigned id. `local` is a placeholder token minted
 * by an `Add*` action earlier in the same `CompositeOperation`; it resolves to a
 * freshly-allocated committed id at apply, and re-resolves against the target's
 * counters on merge/rebase. `local` tokens are scoped to a single
 * `CompositeOperation` and must be distinct within it (validated by the writer once
 * the write path exists).
 */
message Ref {
  oneof kind {
    uint64 committed = 1;
    uint32 local = 2;
  }
}

/*
 * A user-facing, composable transaction: an ordered list of user actions that
 * commit atomically as a single manifest change.
 */
message CompositeOperation {
  // Unique identifier for this operation (matches Transaction.uuid semantics).
  string uuid = 1;
  // The dataset version this operation was planned against.
  uint64 read_version = 2;
  // The ordered list of user actions applied by this operation.
  repeated UserAction actions = 3;
}

/*
 * A single user-recognizable step within a CompositeOperation (e.g. "append batch",
 * "rebuild index").
 *
 * The description keeps the transaction history human-readable. When a range of
 * transactions is squashed, each original CompositeOperation collapses into one
 * UserAction so the readable sequence survives; the action lists are flattened
 * when applied to the manifest.
 */
message UserAction {
  // Human-readable description of this step.
  string description = 1;
  // The granular manifest changes this step expands to.
  repeated Action actions = 2;
}

/*
 * A single granular change (a delta) or assertion. Legacy operations decompose
 * into an ordered list of these.
 *
 * TODO: the `data_change` markers on the actions below are drafted per-action
 * for maximum flexibility; revisit whether per-action or per-UserAction
 * granularity is the right unit before the format stabilizes.
 */
message Action {
  oneof action {
    // -- Minting actions (allocate a new counter-based id via a Local token) --
    AddFragment add_fragment = 1;
    AddField add_field = 3;
    AddBase add_base = 4;
    // -- Fragment / data-file deltas --
    AddDataFile add_data_file = 2;
    TombstoneFieldData tombstone_field_data = 5;
    RemoveFragment remove_fragment = 6;
    // -- Reference-stable changes (committed coordinates; post-image at rest) --
    SetDeletionFile set_deletion_file = 7;
    ConfigUpdate config_update = 8;
    AddOverlays add_overlays = 9;
    RefreshRowVersionMetadata refresh_row_version_metadata = 10;
    // Named `update_compacted_ss_tables` rather than `..._sstables` so the
    // generated oneof variant matches the message name.
    UpdateCompactedSsTables update_compacted_ss_tables = 11;
    // -- Schema (field-level; no wholesale SetSchema) --
    DropField drop_field = 12;
    AlterField alter_field = 13;
    // -- Index segments --
    AddIndexSegment add_index_segment = 14;
    RemoveIndexSegment remove_index_segment = 15;
    AdjustIndexCoverage adjust_index_coverage = 16;
    // -- Wholesale-within-operation --
    ResetTable reset_table = 17;
    ReserveFragmentIds reserve_fragment_ids = 18;
    // -- Assertions (preconditions, not deltas) --
    AssertUniqueKeys assert_unique_keys = 19;
  }
}

/*
 * Mint a new, empty fragment.
 *
 * Its data files arrive via AddDataFile actions referencing this fragment's
 * `local` token. A freshly-minted fragment has no deletion vector; deletions
 * are applied by a later operation via SetDeletionFile, once the fragment has a
 * committed id.
 */
message AddFragment {
  // Placeholder token for the fragment id, resolved to a committed id at apply.
  uint32 local = 1;
  // Number of physical rows (including rows later tombstoned).
  uint64 physical_rows = 2;
  /*
   * Stable-row-id and row-version sequences, carried exactly as on
   * DataFragment. Absent on datasets without stable row ids.
   */
  oneof row_id_sequence {
    bytes inline_row_ids = 3;
    ExternalFile external_row_ids = 4;
  }
  oneof last_updated_at_version_sequence {
    bytes inline_last_updated_at_versions = 5;
    ExternalFile external_last_updated_at_versions = 6;
  }
  oneof created_at_version_sequence {
    bytes inline_created_at_versions = 7;
    ExternalFile external_created_at_versions = 8;
  }
  /*
   * false => rearrangement only (rows unchanged, e.g. compaction); CDC and
   * streaming consumers may skip it. Absent is treated as true (real change).
   */
  optional bool data_change = 9;
}

/*
 * Add a data file to a fragment.
 */
message AddDataFile {
  // The fragment to add the file to (Committed, or a same-op Local fragment).
  Ref fragment = 1;
  /*
   * The data file. Its `fields` are left unset (-1) and stamped in at apply
   * once `field_ids` resolve; `field_ids` below is the authority for the
   * column -> field mapping.
   */
  DataFile file = 2;
  /*
   * One entry per column in `file`, in order. Committed for existing fields,
   * Local for fields minted by an AddField in the same operation.
   */
  repeated Ref field_ids = 3;
  // Data-change marker; see AddFragment.data_change.
  optional bool data_change = 4;
}

/*
 * Mint a new schema field.
 *
 * A struct/list column that introduces several fields is expressed as several
 * ordered AddField actions (parent before children, children referencing the
 * parent via a Local ref).
 */
message AddField {
  // Placeholder token for the new field id, resolved at apply.
  uint32 local = 1;
  /*
   * The parent field: Committed to reparent under an existing field, Local for
   * a sibling minted in the same operation. Absent => top-level column.
   */
  optional Ref parent = 2;
  // Field definition; its `id` and `parent_id` are ignored (see `local`, `parent`).
  lance.file.Field def = 3;
}

/*
 * Mint a new base path.
 */
message AddBase {
  // Placeholder token for the base id, resolved at apply.
  uint32 local = 1;
  // Base path; its `id` is ignored and stamped in at apply.
  BasePath base = 2;
}

/*
 * Tombstone the data-file binding of one or more committed fields.
 *
 * Each field's slot in whatever data file currently backs it is set to -2, and
 * any file left with no live fields is pruned at apply. This is how a column's
 * data is dropped or superseded (data files have no id of their own; a live
 * field is backed by exactly one file). A column re-encode is
 * TombstoneFieldData(X) followed by AddDataFile(new file, field X).
 */
message TombstoneFieldData {
  Ref fragment = 1;
  // The fields whose current backing is tombstoned.
  repeated Ref field_ids = 2;
  // Data-change marker; see AddFragment.data_change.
  optional bool data_change = 3;
}

/*
 * Remove a fragment entirely (all rows deleted, or replaced by compaction).
 */
message RemoveFragment {
  Ref fragment = 1;
  // Data-change marker; see AddFragment.data_change.
  optional bool data_change = 2;
}

/*
 * Set (replace) a fragment's deletion file.
 *
 * Reference-stable: the fragment id is committed and physical row offsets are
 * stable, so the post-image deletion file is safe to store. The newly-deleted
 * rows (the delta used for rebase and conflict) are derived by diffing against
 * the read-version deletion file and are not serialized here.
 */
message SetDeletionFile {
  // The fragment, by committed id: unlike the sibling fragment actions this
  // takes no Ref, because a fragment minted in the same operation has no rows
  // to delete yet (see AddFragment).
  uint64 fragment = 1;
  DeletionFile deletion_file = 2;
  // Data-change marker; see AddFragment.data_change.
  optional bool data_change = 3;
}

/*
 * Apply config / metadata updates.
 *
 * Reference-stable key-merges over stable coordinates (config keys, field ids).
 * Mirrors the new-style fields of the legacy UpdateConfig operation.
 */
message ConfigUpdate {
  optional UpdateMap config = 1;
  optional UpdateMap table_metadata = 2;
  optional UpdateMap schema_metadata = 3;
  /*
   * Per-field metadata updates, keyed by Ref so a field minted in the same
   * operation (Local) can receive metadata.
   */
  repeated FieldMetadata field_metadata = 4;

  message FieldMetadata {
    Ref field = 1;
    UpdateMap updates = 2;
  }
}

/*
 * Append overlay files to fragments (see DataOverlayFile in table.proto).
 *
 * Reference-stable: overlays target committed fragments/offsets/fields and are
 * appended, never replacing existing overlays.
 */
message AddOverlays {
  Ref fragment = 1;
  repeated DataOverlayFile overlays = 2;
  // Data-change marker; see AddFragment.data_change.
  optional bool data_change = 3;
}

/*
 * Refresh row-version (created-at / last-updated-at) metadata for fragments
 * whose columns were merged in place, mirroring the implicit refresh Merge
 * performs on stable-row-id datasets.
 */
message RefreshRowVersionMetadata {
  repeated uint64 fragment_ids = 1;
}

/*
 * Mark MemWAL SSTables as compacted into the base table. Covers
 * UpdateMemWalState and the compaction bookkeeping of Update.
 */
message UpdateCompactedSsTables {
  repeated CompactedSsTable compacted_sstables = 1;
}

/*
 * Remove a field from the schema (and, at apply, prune any data file left with
 * no live fields). References an existing committed field id.
 */
message DropField {
  Ref field = 1;
}

/*
 * Alter facets of an existing field in place, preserving its identity (id).
 *
 * Each facet is optional: present means "change this facet", absent means
 * "leave unchanged". Keying conflict on (field id, facet) lets independent
 * facet changes to the same field commute (e.g. a cast concurrent with a
 * nullability change). A cast additionally needs TombstoneFieldData plus a new
 * AddDataFile to rewrite the data. New facets are added as optional fields.
 */
message AlterField {
  Ref field = 1;
  optional string name = 2;
  // New Arrow logical type (see Field.logical_type). The cast.
  optional string logical_type = 3;
  optional bool nullable = 4;
}

/*
 * Add an index segment.
 *
 * A brand-new index is expressed as its first segment; the set of segments
 * sharing `name` constitutes one logical index.
 */
message AddIndexSegment {
  UUID uuid = 1;
  string name = 2;
  // Indexed field ids (Committed, or Local for same-op minted fields).
  repeated Ref fields = 3;
  google.protobuf.Any index_details = 4;
  optional int32 index_version = 5;
  /*
   * Fragments covered by this segment (resolved to a fragment_bitmap at apply,
   * and remapped under fragment relocation).
   *
   * Absent means the coverage is unknown, which is what the system indices
   * (MemWAL, fragment reuse) carry and what pre-bitmap segments read back as.
   * That is a different statement from a present-but-empty list, which says the
   * segment covers no fragment at all -- the query path serves a segment of
   * unknown coverage and skips one that covers nothing.
   */
  optional FragmentCoverage covered_fragments = 6;
  /*
   * Index files with sizes, when produced by the writer (e.g. a compaction that
   * rewrites the segment). Empty when unavailable.
   */
  repeated IndexFile files = 7;
  // Data-change marker; see AddFragment.data_change. false marks a segment
  // rebuild/compaction that does not reflect any change to the indexed data.
  optional bool data_change = 8;
  /*
   * The base path this segment's files live under, for a segment imported from
   * another dataset. Committed, or Local for a base minted by an AddBase in the
   * same operation. Absent => the dataset's own index directory.
   */
  optional Ref base = 9;
  /*
   * When this segment was built, in milliseconds since the Unix epoch. Absent
   * for a segment whose build time was not recorded.
   */
  optional uint64 created_at = 10;
  /*
   * The dataset version whose data this segment reflects.
   *
   * This is a correctness gate, not provenance: an overlay committed at or
   * before it is treated as already folded into the index. A segment merged
   * from several older ones reflects only as much as its oldest input, so this
   * is genuinely below the version the operation reads and cannot be derived
   * from it. Absent means the version the operation reads, which is what a
   * freshly built segment reflects. It may never exceed that version.
   */
  optional uint64 dataset_version = 11;
}

/*
 * A list of fragments, wrapped so that "no coverage recorded" is distinguishable
 * from "covers nothing" (a bare `repeated` field cannot tell them apart).
 */
message FragmentCoverage {
  // Committed, or Local for a fragment minted in the same operation.
  repeated Ref fragments = 1;
}

/*
 * Remove an index segment by uuid.
 */
message RemoveIndexSegment {
  UUID uuid = 1;
  // Data-change marker; see AddFragment.data_change. false marks removal of a
  // segment superseded by compaction, not a change to the indexed data.
  optional bool data_change = 2;
  /*
   * The logical index the segment belongs to. Carried so apply can check the
   * removal was planned against the segment it actually names; a mismatch means
   * the operation was built against a different set of segments.
   */
  string name = 3;
}

/*
 * Adjust the fragment coverage of an existing index segment without rewriting
 * it.
 *
 * NOTE: coverage representation is an acknowledged open design area; this shape
 * is provisional pending how much coverage change is derivable from fragment
 * relocation versus stated explicitly here.
 */
message AdjustIndexCoverage {
  UUID uuid = 1;
  // Fragments to add to the segment's coverage (Committed or same-op Local).
  repeated Ref add_fragments = 2;
  // Committed fragment ids to drop from the segment's coverage.
  repeated uint64 remove_fragments = 3;
  /*
   * The logical index the segment belongs to. Conflict detection compares
   * coverage across the segments of one index, so it needs the index this
   * adjustment widens, not just the segment. Apply also checks the named
   * segment really carries this name.
   */
  string name = 4;
}

/*
 * Reset the table to an empty state, in preparation for a fresh schema and data
 * written by later actions in the same operation (the decomposition of a full
 * Overwrite / CREATE OR REPLACE).
 *
 * Drops the entire schema, schema metadata, all fragments, and all indices;
 * preserves table config, table metadata, and base paths (change those via
 * ConfigUpdate / AddBase in the same operation). Its write footprint spans the
 * whole schema, all fragments, and all indices, so it conflicts with any
 * concurrent change to them (DROP TABLE-style exclusivity).
 */
message ResetTable {}

/*
 * Reserve a contiguous range of fragment ids from the counter, for a later
 * (possibly distributed) writer to populate. Fragments written against a
 * reserved range reference those ids as Committed.
 */
message ReserveFragmentIds {
  uint32 count = 1;
}

/*
 * An assertion (precondition), not a delta: the keys this operation inserts
 * must not collide with keys inserted by a concurrent commit.
 *
 * Carries a bloom / exact-set filter of the inserted key hashes (not derivable
 * from any post-image); conflict = the two filters intersect. Home for
 * merge-insert's strict primary-key conflict detection.
 */
message AssertUniqueKeys {
  /*
   * Field ids of the key columns (unenforced primary key). Committed, or Local
   * for same-op minted fields. This is the authoritative key-column list;
   * `filter.field_ids` (an artifact of the shared KeyExistenceFilter type) is
   * ignored here and left empty.
   */
  repeated Ref key_fields = 1;
  KeyExistenceFilter filter = 2;
}
