version: 2
updates:
  # Rust — one grouped version-bump PR per directory each week, and security
  # advisories that land together in a directory batched into a single PR
  # instead of one PR per advisory.
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/python"
      - "/java/lance-jni"
    versioning-strategy: lockfile-only
    # Matches the 48h floor enforced by ci/check_dependency_age.py, so grouped
    # bumps do not land a version that CI will then reject. Cooldown does not
    # apply to security updates, which we still want as fast as possible.
    cooldown:
      default-days: 2
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      cargo:
        applies-to: version-updates
        patterns:
          - "*"
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Python (uv) — same weekly-grouped + grouped-security treatment.
  - package-ecosystem: "uv"
    directory: "/python"
    versioning-strategy: lockfile-only
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      uv:
        applies-to: version-updates
        patterns:
          - "*"
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Docs snippets — the exact versions the quickstart examples are tested
  # against. The pins themselves are bumped (not just the lockfile) so the
  # docs track current releases. The lance-spark bundle coordinate in
  # docs/snippets/quickstart/spark* is not a Python dependency and is bumped by
  # hand; a PySpark minor bump fails CI until that coordinate is updated too.
  - package-ecosystem: "uv"
    directory: "/docs/snippets"
    versioning-strategy: increase
    cooldown:
      default-days: 2
    schedule:
      interval: "monthly"
    groups:
      docs-snippets:
        applies-to: version-updates
        patterns:
          - "*"
      docs-snippets-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Standalone Rust lockfiles for dev/test fixtures. Dependabot security updates
  # scan these regardless of config, so we group them; open-pull-requests-limit: 0
  # disables the (unwanted) weekly version bumps for these crates.
  - package-ecosystem: "cargo"
    directories:
      - "/memtest"
      - "/test_data/fri_straddle_pre_6610/datagen"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      cargo-fixtures-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Java (Maven). Security updates fire regardless of config; group them and
  # skip version bumps (limit 0) — we bump Java deps manually.
  - package-ecosystem: "maven"
    directory: "/java"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      maven-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Python benchmark scripts (pip / requirements.txt). Group security updates
  # and skip version bumps (limit 0).
  - package-ecosystem: "pip"
    directories:
      - "/benchmarks/*"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"
