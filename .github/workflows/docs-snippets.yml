name: Docs snippets

# Runs the example code that docs pages embed from docs/snippets, so the
# quickstarts keep working against the versions they tell readers to install.
on:
  push:
    branches:
      - main
    paths:
      - docs/snippets/**
      - docs/src/quickstart/**
      - .github/workflows/docs-snippets.yml
  pull_request:
    paths:
      - docs/snippets/**
      - docs/src/quickstart/**
      - .github/workflows/docs-snippets.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: docs/snippets
    env:
      SPARK_IVY_DIR: ${{ github.workspace }}/.ivy
      # Use the runner's preinstalled Python rather than downloading one.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install protoc
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # protoc
        with:
          tool: protoc
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
        with:
          toolchain: stable
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: docs/snippets/uv.lock
      # The Spark connector bundle and its dependencies are about 1 GB from
      # Maven Central. The key follows spark-sql.sh, which names the connector
      # coordinate, so snippet edits reuse the entry instead of saving another
      # copy. There is no prefix fallback: restoring an older entry would carry
      # its jars into every new one after a version bump.
      - name: Restore Spark packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SPARK_IVY_DIR }}
          key: docs-snippets-ivy-${{ hashFiles('docs/snippets/quickstart/spark-sql.sh') }}
      - name: Restore Cargo registry and Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.m2/repository
          key: docs-snippets-sdk-${{ hashFiles('docs/snippets/quickstart/rust-cargo.toml', 'docs/snippets/quickstart/java-maven-deps.xml') }}
      - name: Run snippets
        run: uv run --locked pytest tests -v
