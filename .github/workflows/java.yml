name: Build and Run Java JNI Tests

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**
    paths:
      - java/**
      - rust/**
      - .github/workflows/java.yml

env:
  # This env var is used by Swatinem/rust-cache@v2 for the cache
  # key, so we set it to make sure it is always consistent.
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

permissions:
  contents: read

jobs:
  rust-clippy-fmt:
    runs-on: ubuntu-24.04
    name: Rust Clippy and Fmt Check
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: |
            lance
            java/lance-jni -> ../target/rust-maven-plugin/lance-jni
      - name: Install protoc
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # protoc
        with:
          tool: protoc
      - uses: rui314/setup-mold@725a8794d15fc7563f59595bd9556495c0564878 # v1
      - name: Run cargo fmt
        working-directory: java/lance-jni
        run: cargo fmt --check
      - name: Rust Clippy
        working-directory: java/lance-jni
        run: cargo clippy --all-targets --locked -- -D warnings

  build-jni:
    runs-on: ubuntu-24.04-4x
    timeout-minutes: 60
    name: Build and Test lance-jni
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install protoc
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # protoc
        with:
          tool: protoc
      # pin the toolchain version to avoid surprises
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
        with:
          toolchain: stable
      - uses: rui314/setup-mold@725a8794d15fc7563f59595bd9556495c0564878 # v1
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: java/lance-jni -> ../target/rust-maven-plugin/lance-jni
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17
      # Isolate the JNI build's Maven cache from downstream test/publish jobs
      # and fall back across version bumps in java/pom.xml via restore-keys.
      - name: Cache JNI Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          MAVEN_CACHE_PREFIX: maven-java-jni-${{ runner.os }}-${{ runner.arch }}-
        with:
          path: ~/.m2/repository
          key: ${{ env.MAVEN_CACHE_PREFIX }}${{ hashFiles('java/**/pom.xml', 'java/.mvn/**') }}
          restore-keys: ${{ env.MAVEN_CACHE_PREFIX }}
      # Runs the build-jni profile (cargo build + cargo test) but skips the Java
      # tests, which run in the per-JDK jobs against the uploaded library.
      - name: Build and test lance-jni
        working-directory: java
        run: mvn -B -Daether.connector.http.retryHandler.count=6 test -Dmaven.test.skip=true -Dspotless.skip=true
      - name: Upload native library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lance-jni-nativelib
          path: java/target/classes/nativelib
          if-no-files-found: error
          retention-days: 1

  build-and-test-java:
    needs: build-jni
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        java-version: [11, 17, 21, 25]
    name: Build and Test with Java ${{ matrix.java-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # JarJniLoader loads the library from /nativelib/<platform> on the classpath.
      - name: Download native library
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lance-jni-nativelib
          path: java/target/classes/nativelib
      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      # Jobs that skip Spotless can finish without downloading its formatter.
      - name: Cache Java test dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          MAVEN_CACHE_PREFIX: maven-java-tests-${{ runner.os }}-${{ runner.arch }}-${{ matrix.java-version == '25' && 'without-spotless' || 'with-spotless' }}-
        with:
          path: ~/.m2/repository
          key: ${{ env.MAVEN_CACHE_PREFIX }}${{ hashFiles('java/**/pom.xml', 'java/.mvn/**') }}
          restore-keys: ${{ env.MAVEN_CACHE_PREFIX }}
      # Skip the format gate on Java 25: google-java-format 1.22.0 (pinned via
      # spotless) reaches into com.sun.tools.javac internals and throws
      # NoSuchMethodError on JDK 25's javac. No google-java-format release runs
      # on JDK 25 without also dropping JDK 11/17 support, so we exclude 25 from
      # the (JDK-independent, already-enforced-on-11/17/21) style check instead.
      - name: Running code style check with Java ${{ matrix.java-version }}
        if: matrix.java-version != '25'
        working-directory: java
        shell: bash
        run: |
          log="$RUNNER_TEMP/spotless-check.log"
          dependency_error='^\[ERROR\] Failed to execute goal com\.diffplug\.spotless:spotless-maven-plugin:[^:]+:check .*Unable to resolve dependencies:'
          central='https://repo\.maven\.apache\.org/maven2/?'
          retryable="HTTP Status: 429|Could not find artifact .+ in [^[:space:]]+ \($central\)| was not found in $central during a previous attempt"
          update_flags=()

          for delay in 10 30 60; do
            if mvn -B "${update_flags[@]}" spotless:check |& tee "$log"; then
              exit 0
            else
              status=$?
            fi
            if ! grep -Eq "$dependency_error.*($retryable)" "$log"; then
              exit "$status"
            fi

            printf 'Retrying Spotless dependency resolution in %s seconds.\n' "$delay"
            sleep "$delay"
            update_flags=(-U)
          done
          mvn -B -U spotless:check
      - name: Start localstack
        run: |
          docker compose -f docker-compose.yml up -d --wait
      - name: Running tests with Java ${{ matrix.java-version }}
        working-directory: java
        env:
          LANCE_INTEGRATION_TEST: "1"
        run: |
          # spotless is also bound into the build lifecycle, so on Java 25 the
          # format gate must be skipped here too (-Dspotless.skip=true), not just
          # in the standalone step above.
          # Skip installing the built Lance artifact into the dependency cache.
          mvn -B -Daether.connector.http.retryHandler.count=6 install -Dskip.build.jni=true -Dmaven.install.skip=true ${{ matrix.java-version == '25' && '-Dspotless.skip=true' || '' }}
