name: T210 input lifetime qualification

on:
  push:
    branches: [yang/t210-miniblock-input-lifetime-20261114]

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-24.04-8x
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - name: Verify exact source
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Validate physical allocation admission
        run: cargo test --profile ci --locked -p lance-core --lib utils::allocation::tests -- --nocapture
      - name: Validate admitted reads and finite concurrency
        run: cargo test --profile ci --locked -p lance-io --lib reserved_read::tests -- --nocapture
      - name: Validate admitted decoder buffer boundaries
        run: cargo test --profile ci --locked -p lance-encoding --all-features --lib buffer::tests -- --nocapture
      - name: Validate admitted bitpacking and existing range decoding
        run: >-
          cargo test --profile ci --locked -p lance-encoding --all-features --lib encodings::physical::bitpacking:: -- --nocapture
      - name: Validate MiniBlock composition after chunk validation refactor
        run: cargo test --profile ci --locked -p lance-encoding --all-features --lib encodings::logical::primitive::miniblock_decode::tests -- --nocapture
      - name: Validate allocation API examples
        run: cargo test --profile ci --locked -p lance-core --doc utils::allocation
      - name: Validate reserved read API example
        run: cargo test --profile ci --locked -p lance-io --doc reserved_read
      - name: Validate admitted decoder buffer examples
        run: cargo test --profile ci --locked -p lance-encoding --all-features --doc buffer::LanceBuffer::try_
      - name: Validate admitted codec example
        run: cargo test --profile ci --locked -p lance-encoding --all-features --doc compression::MiniBlockDecompressor::try_decompress_range_in
      - name: Lint touched crates
        run: cargo clippy --profile ci --locked -p lance-core -p lance-io -p lance-encoding --all-features --all-targets --no-deps -- -D warnings
