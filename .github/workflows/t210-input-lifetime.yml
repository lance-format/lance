name: T210 input lifetime qualification

on:
  push:
    branches: [yang/t210-miniblock-input-lifetime-20261114]

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-24.04-8x
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - name: Verify exact source
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      # FSST primitives passed at df5e9780f and physical default admission at
      # 219a0327f. Check all users of the corrected Binary framing fixture and
      # finish the feature/API stages skipped by the invalid u16 fixture.
      - name: Validate Binary framing and FSST task composition
        run: cargo test --profile ci --locked -p lance-encoding --lib admitted::tests::binary -- --nocapture
      - name: Validate FSST without optional codecs
        run: |
          cargo test --profile ci --locked -p lance-encoding --no-default-features --lib physical::fsst::admitted::tests -- --nocapture
          cargo test --profile ci --locked -p lance-encoding --no-default-features --lib admitted::tests::binary::fsst -- --nocapture
      - name: Validate public borrowed traversal API example
        run: cargo test --profile ci --locked -p lance-encoding --doc visit_binary_values -- --nocapture
      - name: Lint touched crate
        if: ${{ !cancelled() }}
        run: |
          cargo clippy --profile ci --locked -p lance-encoding --all-features --all-targets --no-deps -- -D warnings
          cargo clippy --profile ci --locked -p lance-encoding --no-default-features --all-targets --no-deps -- -D warnings
