name: T210 input lifetime qualification

on:
  push:
    branches: [yang/t210-miniblock-input-lifetime-20261114]

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-24.04-8x
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - name: Verify exact source
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      # List/constant behavior passed at f4d4d4d9c (164 cases + API example),
      # and strict lint at d241585b6. At b74fa2789, 34 codec cases passed;
      # two full-width fixtures failed in writer setup. Validate the revised
      # reader fixtures and the composition/examples/checks not yet reached.
      - name: Validate structural codec reader fixtures
        run: >-
          cargo test --profile ci --locked -p lance-encoding --all-features --lib compression::levels::tests::bitpacked::both_stable_tail_layouts -- --nocapture
      - name: Validate encoded level ownership composition
        run: >-
          cargo test --profile ci --locked -p lance-encoding --all-features --lib repdef::admitted::compressed:: -- --nocapture
      - name: Validate structural codec API example
        run: cargo test --profile ci --locked -p lance-encoding --all-features --doc LevelDecodePlan
      - name: Validate encoded level API example
        run: cargo test --profile ci --locked -p lance-encoding --all-features --doc try_from_encoded_in
      - name: Check capability without bitpacking
        run: cargo check --profile ci --locked -p lance-encoding --no-default-features --lib
      - name: Lint touched crate
        run: cargo clippy --profile ci --locked -p lance-encoding --all-features --all-targets --no-deps -- -D warnings
