name: T210 input lifetime qualification

on:
  push:
    branches: [yang/t210-miniblock-input-lifetime-20261114]

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-24.04-8x
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - name: Install protoc for Lance all-features lint
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # protoc
        with:
          tool: protoc
      - name: Verify exact source
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Verify admitted fragment cursor composition
        env:
          LANCE_CPU_THREADS: 1
        run: |
          # Existing take/materializer implementations are unchanged. Exercise
          # cursor commit/refusal and actual overlay/deletion/placeholder composition.
          cargo test --profile ci --locked -p lance --lib dataset::fragment::tests::overlay_read::admitted::cursor:: -- --nocapture
          cargo test --profile ci --locked -p lance --doc try_scan_admitted_fullzip -- --nocapture
      - name: Lint touched paths
        if: ${{ !cancelled() }}
        run: |
          cargo clippy --profile ci --locked -p lance --all-features --all-targets --no-deps -- -D warnings
