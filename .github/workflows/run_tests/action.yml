name: run-tests

description: "Install lance wheel and run unit tests"
inputs:
  python-minor-version:
    required: true
    description: "9 10 11 12"
  skip-torch:
    required: false
    description: "Skip pytorch tests"
    default: "false"
  memtest:
    required: false
    description: "Install and preload the prebuilt memtest library"
    default: "false"
  pytest-workers:
    required: false
    description: "pytest-xdist worker count; 'auto' matches the runner's cores"
    default: "auto"
runs:
  using: "composite"
  steps:
    - name: Setup MSVC for torch.compile
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
    - name: Install dependencies
      working-directory: python
      shell: bash
      run: |
        pip3 install $(ls target/wheels/pylance-*.whl)[tests,ray]
    - name: Install torch
      working-directory: python
      shell: bash
      if: inputs.skip-torch == 'false'
      run: |
        # Install cpu only pytorch
        pip install torch --index-url https://download.pytorch.org/whl/cpu
    - name: Install memtest
      working-directory: memtest
      if: inputs.memtest == 'true'
      shell: bash
      run: |
        test -f python/memtest/libmemtest.so
        pip install -e .
        echo "LD_PRELOAD=$(lance-memtest)" >> "$GITHUB_ENV"
    - name: Run python tests
      shell: bash
      working-directory: python
      run: make test PYTEST_WORKERS=${{ inputs.pytest-workers }}
