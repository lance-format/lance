name: Rust
on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**
    paths:
      - rust/**
      - protos/**
      - .github/workflows/rust.yml
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
      - python/Cargo.lock
      - java/lance-jni/Cargo.lock
      - .cargo/config.toml
      - clippy.toml
      - deny.toml
      - ci/check_dependency_age.py
      - ci/arrow_upgrade.py

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # This env var is used by Swatinem/rust-cache@v2 for the cache
  # key, so we set it to make sure it is always consistent.
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  package:
    name: Check crates are publishable
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
      # Catches manifest problems that only surface at publish time (missing
      # readme/license files, path dependencies without a version, excluded
      # files a crate needs). `--no-verify` skips building each packaged crate,
      # which the other jobs already cover. Keep the excludes in sync with
      # .github/workflows/cargo-publish.yml.
      - name: Package crates
        run: |
          cargo package --workspace --no-verify \
            --exclude lance-arrow-stats \
            --exclude lance-arrow-scalar \
            --all-features

  rustdoc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install protoc
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # protoc
        with:
          tool: protoc
      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  clippy:
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - name: Install protoc
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # protoc
        with:
          tool: protoc
      - name: Get features
        run: |
          ALL_FEATURES=`cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | .features | keys | .[]' | sort | uniq | paste -s -d "," -`
          echo "ALL_FEATURES=${ALL_FEATURES}" >> $GITHUB_ENV
      - name: Clippy
        run: cargo clippy --profile ci --locked --features ${{ env.ALL_FEATURES }} --all-targets -- -D warnings
      # The `lance-compat` ordering fixtures are `test = false`, which
      # `--all-targets` skips (and a named `--test` is ignored next to
      # `--tests`), so lint them in their own invocation. `--workspace` keeps
      # feature unification identical to the step above.
      - name: Clippy (Arrow ordering fixtures)
        run: cargo clippy --profile ci --locked --workspace --features ${{ env.ALL_FEATURES }} --test arrow_ordering -- -D warnings

  cargo-deny:
    name: Check Rust dependencies (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2
        with:
          log-level: warn
          command: check
      # Runs after cargo-deny so it can reuse the index cargo-deny already
      # fetched. The script falls back to the network when that misses.
      - name: Check dependency age
        run: python3 ci/check_dependency_age.py

  arrow-ordering-detect:
    # Lance inherits its comparison semantics from Arrow, DataFusion and `half`.
    # The ordering fixtures are excluded from the default test run (`test =
    # false` in rust/lance-compat/Cargo.toml) and run only from the
    # `arrow-ordering-compat` job below, which this small job gates: it fires
    # when a PR changes one of those versions in Cargo.lock, or touches the
    # fixtures, these jobs, the detector, or the Lance crates the fixtures
    # exercise, so edits to the check itself are verified too.
    name: Detect Arrow ordering-relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.detect.outputs.run }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
    env:
      FIXTURE: rust/lance-compat/tests/arrow_ordering.rs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Detect dependency or fixture changes
        id: detect
        run: |
          # The checkout is the PR's merge commit, whose first parent is the base
          # branch as merged. The event payload's base SHA goes stale on a re-run
          # after the base branch moved, so the parent is the reference used.
          base_sha=$(git rev-parse HEAD^1 2>/dev/null || echo "${{ github.event.pull_request.base.sha }}")
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          git fetch --no-tags --depth=1 origin "$base_sha"
          git show "$base_sha:Cargo.lock" > "$RUNNER_TEMP/base.Cargo.lock"
          python3 ci/arrow_upgrade.py "$RUNNER_TEMP/base.Cargo.lock" Cargo.lock
          # Changes to the check itself, or to the Lance crates it exercises,
          # also run the fixtures so the check is never merged untested.
          self_changed=$(git diff --name-only "$base_sha" HEAD -- \
            rust/lance-compat ci/arrow_upgrade.py .github/workflows/rust.yml \
            rust/arrow-scalar rust/arrow-stats)
          if [ -n "$self_changed" ]; then
            echo "fixtures or the paths they exercise changed:"
            echo "$self_changed"
          fi
          if [ -n "$self_changed" ] || grep -q '^changed=true$' "$GITHUB_OUTPUT"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  arrow-ordering-compat:
    # The fixtures *from the base branch* run first, so an upgrade cannot pass
    # by refreshing the expectations in the same PR; a reviewed change is
    # admitted with the `arrow-ordering-reviewed` label, read live so a re-run
    # after labelling sees it. The PR's own copy runs after.
    name: Arrow ordering compatibility
    needs: arrow-ordering-detect
    if: needs.arrow-ordering-detect.outputs.run == 'true'
    runs-on: "ubuntu-24.04-8x"
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    env:
      CC: clang
      CXX: clang++
      # No `-D warnings` here: this job builds with default features, under
      # which feature-gated code warns as dead, and a dependency bump may
      # deprecate an API the base fixtures use. The clippy job enforces
      # warnings; this job's only question is whether the ordering changed.
      BASE_SHA: ${{ needs.arrow-ordering-detect.outputs.base_sha }}
      FIXTURE: rust/lance-compat/tests/arrow_ordering.rs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: rui314/setup-mold@725a8794d15fc7563f59595bd9556495c0564878 # v1
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - name: Install protoc
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # protoc
        with:
          tool: protoc
      - name: Run base-branch fixtures against the upgraded dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          # The base branch's expectations are the contract under test.
          if ! git cat-file -e "$BASE_SHA:$FIXTURE" 2>/dev/null; then
            echo "::notice::No ordering fixtures on the base branch; only the PR's copy is checked."
            exit 0
          fi
          git show "$BASE_SHA:$FIXTURE" > "$FIXTURE"
          # Labels are read live rather than from the event payload so that a
          # re-run after labelling admits the change.
          reviewed=false
          if gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels -q '.labels[].name' | grep -qx 'arrow-ordering-reviewed'; then
            reviewed=true
          fi
          # A compile failure means the upgrade renamed an API the fixtures use;
          # that is a port, not an ordering finding, and is reported as such.
          if ! cargo test --profile ci --locked -p lance-compat --test arrow_ordering --no-run; then
            if [ "$reviewed" = "true" ]; then
              echo "::warning::Base-branch fixtures do not compile against the upgraded dependencies; admitted by the arrow-ordering-reviewed label. Only the PR's copy is checked."
              exit 0
            fi
            echo "::error::Base-branch fixtures do not compile against the upgraded dependencies, so the ordering contract could not be checked. Port the fixture file without changing expectations, review the release notes in the job summary, then apply the arrow-ordering-reviewed label."
            exit 1
          fi
          if cargo test --profile ci --locked -p lance-compat --test arrow_ordering; then
            exit 0
          fi
          if [ "$reviewed" = "true" ]; then
            echo "::warning::Arrow ordering changed; admitted by the arrow-ordering-reviewed label."
            exit 0
          fi
          echo "::error::Arrow ordering changed against the base-branch fixtures. Review the release notes in the job summary, record the affected Lance paths and any persisted-structure handling in the PR, then apply the arrow-ordering-reviewed label."
          exit 1
      - name: Run the PR's fixtures against the upgraded dependencies
        run: |
          git checkout -- "$FIXTURE"
          cargo test --profile ci --locked -p lance-compat --test arrow_ordering

  linux-build:
    runs-on: "ubuntu-24.04-8x"
    timeout-minutes: 75
    env:
      # Need up-to-date compilers for kernels
      CC: clang
      CXX: clang++
      # Treat warnings as errors to catch issues early
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup rust toolchain
        run: |
          rustup toolchain install stable
          rustup default stable
      - uses: rui314/setup-mold@725a8794d15fc7563f59595bd9556495c0564878 # v1
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - name: Install protoc
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # protoc
        with:
          tool: protoc
      - name: Install cargo-nextest
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # nextest
        with:
          tool: nextest
      - name: Build tests
        run: |
          ALL_FEATURES=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | .features | keys | .[]' | grep -v -e protoc | sort | uniq | paste -s -d "," -)
          cargo nextest run \
            --cargo-profile ci \
            --locked \
            --workspace \
            --features "${ALL_FEATURES}" \
            --no-run
      - name: Start DynamoDB and S3
        run: docker compose -f docker-compose.yml up -d --wait
      - name: Run tests
        run: |
          ALL_FEATURES=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | .features | keys | .[]' | grep -v -e protoc | sort | uniq | paste -s -d "," -)
          cargo nextest run \
            --cargo-profile ci \
            --locked \
            --workspace \
            --features "${ALL_FEATURES}"

  linux-arm:
    runs-on: ubuntu-24.04-arm64-8x
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup rust toolchain
        run: |
          rustup toolchain install stable
          rustup default stable
      - uses: rui314/setup-mold@725a8794d15fc7563f59595bd9556495c0564878 # v1
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - name: Install protoc
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # protoc
        with:
          tool: protoc
      - name: Build tests
        run: |
          ALL_FEATURES=`cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | .features | keys | .[]' | grep -v -e protoc | sort | uniq | paste -s -d "," -`
          cargo test --profile ci --locked --features ${ALL_FEATURES} --no-run
      - name: Start DynamodDB and S3
        run: docker compose -f docker-compose.yml up -d --wait
      - name: Run tests
        run: |
          ALL_FEATURES=`cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | .features | keys | .[]' | grep -v -e protoc | sort | uniq | paste -s -d "," -`
          cargo test --profile ci --locked --features ${ALL_FEATURES}
  build-no-lock:
    runs-on: ubuntu-24.04-8x
    timeout-minutes: 30
    env:
      # Need up-to-date compilers for kernels
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
      # Remote cargo.lock to force a fresh build
      - name: Remove Cargo.lock
        run: rm -f Cargo.lock
      - uses: rui314/setup-mold@725a8794d15fc7563f59595bd9556495c0564878 # v1
      - name: Install protoc
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # protoc
        with:
          tool: protoc
      - name: Build all
        run: |
          ALL_FEATURES=`cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | .features | keys | .[]' | grep -v -e protoc | sort | uniq | paste -s -d "," -`
          cargo build --profile ci --benches --features ${ALL_FEATURES} --tests
  mac-build:
    runs-on: warp-macos-14-arm64-6x
    timeout-minutes: 45
    strategy:
      matrix:
        toolchain:
          - stable
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Select new xcode
        # Default XCode right now is 15.0.1, which contains a bug that causes
        # backtraces to not show properly. See:
        # https://github.com/rust-lang/rust/issues/113783
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Install dependencies
        run: brew install protobuf
      - name: Set up Rust
        run: |
          rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # nextest
        with:
          tool: nextest
      # macOS runner capacity is the scarcest in CI, so this job is kept as short
      # as it can be. nextest runs each test in its own process and schedules
      # across all cores, rather than one test binary at a time. Benchmarks are
      # only compile-checked here, which build-no-lock already does on Linux;
      # nothing about bench compilation is macOS-specific.
      - name: Build tests
        run: |
          cargo nextest run --cargo-profile ci --locked --features fp16kernels,cli,dynamodb,substrait --no-run
      - name: Run tests
        run: |
          cargo nextest run --cargo-profile ci --features fp16kernels,cli,dynamodb,substrait
  windows-build:
    runs-on: windows-latest-4x
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - name: Install Protoc v21.12
        working-directory: C:\
        run: |
          New-Item -Path 'C:\protoc' -ItemType Directory
          Set-Location C:\protoc
          Invoke-WebRequest https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-win64.zip -OutFile C:\protoc\protoc.zip
          7z x protoc.zip
          Add-Content $env:GITHUB_PATH "C:\protoc\bin"
        shell: powershell
      - name: Install cargo-nextest
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # nextest
        with:
          tool: nextest
      # Same reasoning as mac-build: nextest schedules across all cores instead
      # of running one test binary at a time, and build-no-lock already
      # compile-checks the benchmarks on Linux.
      - name: Build tests
        run: cargo nextest run --cargo-profile ci --locked --no-run
      - name: Run tests
        run: cargo nextest run --cargo-profile ci

  qemu-pre-haswell:
    # Verifies that lance-linalg's runtime SIMD dispatch still works
    # correctly when the binary is built with the lower x86-64-v2 baseline
    # (the legacy build path documented in CONTRIBUTING.md). Emulates a
    # Nehalem CPU under qemu-user; catches any accidental AVX2/FMA
    # instructions that leak past the runtime dispatch.
    #
    # The published-wheel default baseline (`target-cpu=haswell`) is set in
    # `.cargo/config.toml`; this job overrides RUSTFLAGS for one job to
    # exercise the legacy path without affecting any other build.
    name: pre-Haswell SIGILL check (qemu Nehalem)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "qemu-x86_64 -cpu Nehalem"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup rust toolchain
        run: |
          rustup toolchain install stable
          rustup default stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - name: Restore QEMU 8.2.10
        id: qemu-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lance-qemu/8.2.10/qemu-x86_64
          key: qemu-user-8.2.10-x86_64-linux-user-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install protoc
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # protoc
        with:
          tool: protoc
      - name: Install QEMU build dependencies
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt install -y \
            ninja-build \
            pkg-config \
            libglib2.0-dev \
            python3-venv \
            curl \
            xz-utils
      - name: Build QEMU 8.2.10
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          QEMU_VERSION=8.2.10
          QEMU_ARCHIVE="qemu-${QEMU_VERSION}.tar.xz"
          QEMU_BIN_DIR="${RUNNER_TEMP}/lance-qemu/${QEMU_VERSION}"
          QEMU_SOURCE_DIR="${RUNNER_TEMP}/qemu-${QEMU_VERSION}"

          # Ubuntu 24.04 ships QEMU 8.2.2, which is affected by
          # https://gitlab.com/qemu-project/qemu/-/issues/2170.
          curl --fail --location --silent --show-error \
            "https://download.qemu.org/${QEMU_ARCHIVE}" \
            --output "${RUNNER_TEMP}/${QEMU_ARCHIVE}"
          echo "37b4a643da8ed6015eef35f5d7f06e7259d9c95359965a0a98e9667c621ab2bb  ${RUNNER_TEMP}/${QEMU_ARCHIVE}" \
            | sha256sum --check -
          tar --extract \
            --file "${RUNNER_TEMP}/${QEMU_ARCHIVE}" \
            --directory "${RUNNER_TEMP}"
          mkdir "${QEMU_SOURCE_DIR}/build"
          (
            cd "${QEMU_SOURCE_DIR}/build"
            ../configure --target-list=x86_64-linux-user --disable-docs
            ninja qemu-x86_64
          )
          mkdir -p "${QEMU_BIN_DIR}"
          install -m 0755 \
            "${QEMU_SOURCE_DIR}/build/qemu-x86_64" \
            "${QEMU_BIN_DIR}/qemu-x86_64"
      - name: Add QEMU to PATH
        run: |
          QEMU_BIN_DIR="${RUNNER_TEMP}/lance-qemu/8.2.10"
          echo "${QEMU_BIN_DIR}" >> "${GITHUB_PATH}"
          QEMU_VERSION_OUTPUT="$("${QEMU_BIN_DIR}/qemu-x86_64" --version)"
          echo "${QEMU_VERSION_OUTPUT}"
          if [[ "${QEMU_VERSION_OUTPUT}" != *"version 8.2.10"* ]]; then
            echo "Expected QEMU 8.2.10, got: ${QEMU_VERSION_OUTPUT}" >&2
            exit 1
          fi
      - name: Build lance-linalg lib tests in release mode
        run: |
          cargo test --release -p lance-linalg --lib --no-run
      - name: Run lance-linalg lib tests under qemu Nehalem
        run: |
          cargo test --release -p lance-linalg --lib

  msrv:
    # Check the minimum supported Rust version
    name: MSRV Check - Rust v${{ matrix.msrv }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        msrv: ["1.94.0"] # This should match up with rust-version in Cargo.toml
    env:
      # Need up-to-date compilers for kernels
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - name: Install protoc
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # protoc
        with:
          tool: protoc
      - name: Install ${{ matrix.msrv }}
        run: |
          rustup toolchain install ${{ matrix.msrv }}
      - name: cargo +${{ matrix.msrv }} check
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.msrv }}
        run: |
          ALL_FEATURES=`cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | .features | keys | .[]' | grep -v -e protoc | sort | uniq | paste -s -d "," -`
          cargo check --profile ci --workspace --tests --benches --features ${ALL_FEATURES}
