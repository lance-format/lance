name: T-224 Java native resource validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-linux:
    name: Build on Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            # Keep the final fat-LTO JNI build on the larger runner used by Rust CI.
            runner: ubuntu-24.04-8x
            docker_platform: linux/amd64
            protoc_arch: x86_64
            artifact: liblance_jni_linux_x86_64.zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: 409d1f6a5bbf5e8ad7daa25a2e99b7a871b0776e
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Show runner resources
        run: |
          nproc
          free -b
          df -h /
      - name: Check glibc version outside docker
        run: ldd --version
      - name: Build and run in Debian 10 container
        run: |
          docker run --platform ${{ matrix.docker_platform }} -v ${{ github.workspace }}:/workspace -w /workspace debian:10 bash -c "

            set -ex
            # Update sources.list to use archive repositories for Debian 10 (EOL)
            echo 'deb http://archive.debian.org/debian/ buster main' > /etc/apt/sources.list
            echo 'deb http://archive.debian.org/debian-security buster/updates main' >> /etc/apt/sources.list
            echo 'deb http://archive.debian.org/debian/ buster-updates main' >> /etc/apt/sources.list
            apt-get update

            DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends --assume-yes \
              apt-transport-https \
              ca-certificates \
              curl \
              gpg \
              bash \
              less \
              openssl \
              libssl-dev \
              pkg-config \
              libsqlite3-dev \
              libsqlite3-0 \
              libreadline-dev \
              git \
              cmake \
              dh-autoreconf \
              clang \
              g++ \
              libc++-dev \
              libc++abi-dev \
              libprotobuf-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libudev-dev \
              libhidapi-dev \
              zip \
              unzip \
              time

            # https://github.com/databendlabs/databend/issues/8035
            PROTOC_ZIP=protoc-3.15.0-linux-${{ matrix.protoc_arch }}.zip
            curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v3.15.0/\$PROTOC_ZIP
            unzip -o \$PROTOC_ZIP -d /usr/local
            rm -f \$PROTOC_ZIP
            protoc --version

            curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable
            source \$HOME/.cargo/env
            cargo --version

            cd java/lance-jni

            # https://github.com/rustls/rustls/issues/1967
            export CC=clang
            export CXX=clang++
            ldd --version

            /usr/bin/time -v cargo build --release --locked --verbose
          "
