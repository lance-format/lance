name: Build and publish Java packages
on:
  release:
    # Trigger on published to include both stable and preview/beta releases
    types: [published]
  pull_request:
    branches:
      - main
      - release/**
    paths:
      - .github/workflows/java-publish.yml
      - ci/publish_java_r2.py
      - ci/test_publish_java_r2.py
      - java/pom.xml
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode"
        required: true
        type: choice
        default: dry_run
        options:
          - dry_run
          - release
      ref:
        description: "The branch, tag or SHA to checkout"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    name: Build on Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
            docker_platform: linux/amd64
            protoc_arch: x86_64
            artifact: liblance_jni_linux_x86_64.zip
          - arch: arm64
            runner: ubuntu-24.04-arm64-8x
            docker_platform: linux/arm64
            protoc_arch: aarch_64
            artifact: liblance_jni_linux_arm_64.zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Check glibc version outside docker
        run: ldd --version
      - name: Build and run in Debian 10 container
        run: |
          docker run --platform ${{ matrix.docker_platform }} -v ${{ github.workspace }}:/workspace -w /workspace debian:10 bash -c "

            set -ex
            # Update sources.list to use archive repositories for Debian 10 (EOL)
            echo 'deb http://archive.debian.org/debian/ buster main' > /etc/apt/sources.list
            echo 'deb http://archive.debian.org/debian-security buster/updates main' >> /etc/apt/sources.list
            echo 'deb http://archive.debian.org/debian/ buster-updates main' >> /etc/apt/sources.list
            apt-get update

            DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends --assume-yes \
              apt-transport-https \
              ca-certificates \
              curl \
              gpg \
              bash \
              less \
              openssl \
              libssl-dev \
              pkg-config \
              libsqlite3-dev \
              libsqlite3-0 \
              libreadline-dev \
              git \
              cmake \
              dh-autoreconf \
              clang \
              g++ \
              libc++-dev \
              libc++abi-dev \
              libprotobuf-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libudev-dev \
              libhidapi-dev \
              zip \
              unzip

            # https://github.com/databendlabs/databend/issues/8035
            PROTOC_ZIP=protoc-3.15.0-linux-${{ matrix.protoc_arch }}.zip
            curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v3.15.0/\$PROTOC_ZIP
            unzip -o \$PROTOC_ZIP -d /usr/local
            rm -f \$PROTOC_ZIP
            protoc --version

            curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable
            source \$HOME/.cargo/env
            cargo --version

            cd java/lance-jni

            # https://github.com/rustls/rustls/issues/1967
            export CC=clang
            export CXX=clang++
            ldd --version

            cargo build --release --locked
          "
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: java/lance-jni/target/release/liblance_jni.so
          retention-days: 1
          if-no-files-found: error
  build-macos:
    name: Build on MacOS Arm64
    runs-on: warp-macos-14-arm64-6x
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - uses: Homebrew/actions/setup-homebrew@50b8c2ab4a835c38897ed2c56c293b07167c0b59 # master 2026-03-07
      - name: Install dependencies
        run: brew install protobuf
      - name: Build native lib
        working-directory: java/lance-jni
        run: cargo build --release --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: liblance_jni_darwin_aarch64.zip
          path: java/lance-jni/target/release/liblance_jni.dylib
          retention-days: 1
          if-no-files-found: error
  publish:
    name: Publish Java packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build-linux
      - build-macos
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up Java 11
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: corretto
          java-version: 11
          cache: "maven"
          server-id: ossrh
          server-username: SONATYPE_USER
          server-password: SONATYPE_TOKEN
          gpg-private-key: ${{ (github.event_name == 'release' || inputs.mode == 'release') && secrets.GPG_PRIVATE_KEY || '' }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      - name: Copy native libs
        run: |
          mkdir -p ./java/target/classes/nativelib/linux-x86-64 \
            ./java/target/classes/nativelib/linux-aarch64 \
            ./java/target/classes/nativelib/darwin-aarch64
          cp ./liblance_jni_linux_x86_64.zip/liblance_jni.so ./java/target/classes/nativelib/linux-x86-64/liblance_jni.so
          cp ./liblance_jni_linux_arm_64.zip/liblance_jni.so ./java/target/classes/nativelib/linux-aarch64/liblance_jni.so
          cp ./liblance_jni_darwin_aarch64.zip/liblance_jni.dylib ./java/target/classes/nativelib/darwin-aarch64/liblance_jni.dylib
      - name: Set github
        run: |
          git config --global user.email "Lance Github Runner"
          git config --global user.name "dev+gha@lance.org"
      - name: Create disposable signing key for dry run
        if: |
          github.event_name == 'pull_request' ||
          inputs.mode == 'dry_run'
        run: |
          export GNUPGHOME="$RUNNER_TEMP/java-dry-run-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key 'Lance dry run <dev@lance.org>' rsa2048 sign 1d
      - name: Build signed bundle and publish to Central unless dry run
        working-directory: java
        run: |
          mkdir -p "${GNUPGHOME:-$HOME/.gnupg}"
          echo "use-agent" >> "${GNUPGHOME:-$HOME/.gnupg}/gpg.conf"
          echo "pinentry-mode loopback" >> "${GNUPGHOME:-$HOME/.gnupg}/gpg.conf"
          ./mvnw --batch-mode -DskipTests -Dskip.build.jni=true -DpushChanges=false \
            "-Dgpg.passphrase=$GPG_PASSPHRASE" "-DskipPublishing=$SKIP_PUBLISHING" \
            deploy -P deploy-to-ossrh
        env:
          SKIP_PUBLISHING: ${{ !(github.event_name == 'release' || inputs.mode == 'release') }}
          GPG_PASSPHRASE: ${{ (github.event_name == 'release' || inputs.mode == 'release') && secrets.GPG_PASSPHRASE || '' }}
          # The Central plugin requires a server entry even when upload is skipped.
          SONATYPE_USER: ${{ (github.event_name == 'release' || inputs.mode == 'release') && secrets.SONATYPE_USER || 'dry-run' }}
          SONATYPE_TOKEN: ${{ (github.event_name == 'release' || inputs.mode == 'release') && secrets.SONATYPE_TOKEN || 'dry-run' }}
      - name: Preserve signed bundle for independent R2 retries
        if: ${{ !cancelled() && hashFiles('java/target/central-publishing/central-bundle.zip') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-central-bundle
          path: java/target/central-publishing/central-bundle.zip
          retention-days: 30
          if-no-files-found: error
      - name: Install bundle validator
        run: pip install boto3==1.40.76
      - name: Validate the bundle used by both repositories
        run: python ci/publish_java_r2.py java/target/central-publishing/central-bundle.zip --validate-only
  publish-r2:
    name: Publish Java packages to R2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: publish
    if: github.event_name == 'release' || inputs.mode == 'release'
    # Hold the lock through ALL metadata/checksum writes. Queuing avoids dropping
    # pending releases when several builds finish together, including job retries.
    concurrency:
      group: java-maven-r2
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Download the original signed Central bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: java-central-bundle
          path: java-bundle
      - name: Install R2 publisher
        run: pip install boto3==1.40.76
      - name: Set up Java for isolated Maven download verification
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: corretto
          java-version: 11
      - name: Upload immutable artifacts and update Maven metadata
        run: |
          : "${AWS_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY}"
          : "${R2_ENDPOINT:?Set R2_ENDPOINT}"
          : "${R2_BUCKET:?Set R2_BUCKET}"
          : "${R2_PUBLIC_URL:?Set R2_PUBLIC_URL}"
          python ci/publish_java_r2.py java-bundle/central-bundle.zip --public-url "$R2_PUBLIC_URL"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
  report-failure:
    name: Report Workflow Failure
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, publish, publish-r2]
    if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/create-failure-issue
        with:
          job-results: ${{ toJSON(needs) }}
          workflow-name: ${{ github.workflow }}
