name: Windows quantized-cache diagnostic

# Diagnostic only. This workflow localizes the failing phase of the three
# Windows nightly failures observed at 3c570b969c88fa2ad29f18199a3886ec4de3f8be
# (run 43657826113, job 132640223080). This PR is not a merge candidate and must
# not be merged.
#
# Trigger: pull_request only, narrowed to the three diagnostic paths and guarded
# at job level by github.head_ref for the single diagnostic branch. There is no
# push and no workflow_dispatch trigger, so opening/updating this PR is the only
# way this workflow runs.
#
# The PR head carries only this workflow and the two saved patch products. The
# build happens in a second checkout pinned to the exact red head, so later
# commits on the PR branch cannot change what is built or run.
#
# The second patch is the exact production hunk of the published-e_tag repair
# (source commit da8d069191ab8e08b948019079ee947a84be27ea, blob 518f98579269 ->
# 4c8e3710ad24). The workflow applies it after the identity probe, and guards
# both the patch bytes and the resulting blob, so this diagnostic cannot drift
# from the production change. It is not a test-side substitute for the repair.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/windows-quantized-cache-diagnostic.yml
      - ci/diagnostics/quantized-cache-identity-20261115.patch
      - ci/diagnostics/rename-commit-published-etag-20261115.patch

permissions:
  contents: read

concurrency:
  group: windows-quantized-cache-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: Quantized refinement cache lifecycle (3 cases, red head + published-etag repair)
    if: github.head_ref == 'xuanwo/diagnose-quantized-cache-windows-20261115'
    runs-on: windows-latest
    # Reuses the nightly windows-rust-tests timeout; the workspace build is the
    # dominant cost and this job runs the same build graph.
    timeout-minutes: 180
    permissions:
      contents: read
    defaults:
      run:
        working-directory: reproduction/rust
    steps:
      - name: Checkout diagnostic PR head (patch source)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Disable CRLF conversion before the reproduction checkout
        # The Windows runner image sets core.autocrlf=true globally, so the red
        # checkout would carry CRLF bytes. The whole-tree guard below compares
        # worktree bytes against LF blobs; converting them after checkout would
        # surface every converted file as modified. Set the ephemeral runner
        # config before the second checkout so the red tree starts LF.
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          echo "core.autocrlf=$(git config --global --get core.autocrlf)"

      - name: Checkout exact red head 3c570b96 (reproduction tree)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: 3c570b969c88fa2ad29f18199a3886ec4de3f8be
          path: reproduction
          fetch-depth: 1
          persist-credentials: false

      - name: Record runner image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "ImageOS=$env:ImageOS"
          "ImageVersion=$env:ImageVersion"
          "RUNNER_OS=$env:RUNNER_OS RUNNER_ARCH=$env:RUNNER_ARCH"
          "OSVersion=$([System.Environment]::OSVersion.VersionString)"
          $current = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          "ProductName=$($current.ProductName) DisplayVersion=$($current.DisplayVersion) CurrentBuild=$($current.CurrentBuild).$($current.UBR)"
          "workspace=$env:GITHUB_WORKSPACE"
          "run_id=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT"

      - name: Set up Rust cache for both checkouts
        # Same cache action as the nightly Windows job. Both Cargo workspaces are
        # listed because the diagnostic tree and the reproduction tree are
        # separate checkouts with their own target directories.
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: |
            . -> target
            reproduction -> target

      - name: Install Protoc v21.12
        working-directory: C:\
        run: |
          New-Item -Path 'C:\protoc' -ItemType Directory
          Set-Location C:\protoc
          Invoke-WebRequest https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-win64.zip -OutFile C:\protoc\protoc.zip
          7z x protoc.zip
          Add-Content $env:GITHUB_PATH "C:\protoc\bin"
        shell: powershell

      - name: Install cargo-nextest 0.9.129 (version used by the red run)
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # nextest
        with:
          tool: nextest@0.9.129

      - name: Verify red objects, patch oracles, and apply identity instrumentation and repair
        # bash (Git Bash) is used for byte-exact handling: the saved patches are
        # read from the PR-head git objects, never from the CRLF-converted
        # worktree, and are applied to the reproduction checkout only.
        working-directory: reproduction
        shell: bash
        env:
          EXPECTED_DIAGNOSTIC_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          REPRO=$(git rev-parse --show-toplevel)
          DIAG=$(dirname "$REPRO")
          TEST_PATH="rust/lance/src/dataset/tests/dataset_scanner_knn.rs"
          KNN_PATH="rust/lance/src/io/exec/knn.rs"
          INDEX_CACHE_PATH="rust/lance/src/session/index_caches.rs"
          COMMIT_PATH="rust/lance-table/src/io/commit.rs"
          PATCH_PATHS=("$TEST_PATH" "$KNN_PATH" "$INDEX_CACHE_PATH")
          MATERIALIZE_PATHS=("${PATCH_PATHS[@]}" "$COMMIT_PATH")
          PATCH_BLOB_PATH="ci/diagnostics/quantized-cache-identity-20261115.patch"
          PATCH="../quantized-cache-identity-20261115.patch"
          REPAIR_PATCH_BLOB_PATH="ci/diagnostics/rename-commit-published-etag-20261115.patch"
          REPAIR_PATCH="../rename-commit-published-etag-20261115.patch"

          cd "$REPRO"
          HEAD_SHA=$(git rev-parse HEAD)
          echo "reproduction_head=$HEAD_SHA"
          echo "reproduction_subject=$(git log -1 --format=%s)"
          DIAG_HEAD=$(git -C "$DIAG" rev-parse HEAD)
          echo "diagnostic_head=$DIAG_HEAD"
          echo "expected_diagnostic_head=$EXPECTED_DIAGNOSTIC_HEAD"
          if [ "$HEAD_SHA" != "3c570b969c88fa2ad29f18199a3886ec4de3f8be" ]; then
            echo "::error::unexpected reproduction head: $HEAD_SHA"
            exit 1
          fi
          if [ "$DIAG_HEAD" != "$EXPECTED_DIAGNOSTIC_HEAD" ]; then
            echo "::error::diagnostic checkout is not the PR head: $DIAG_HEAD"
            exit 1
          fi

          # Committed object identity. This reads HEAD:<path>, not the worktree
          # file, so a CRLF checkout cannot shift these ids.
          check_object() {
            local path="$1" want="$2" got
            got=$(git rev-parse "HEAD:$path")
            echo "object=$path sha=$got"
            if [ "$got" != "$want" ]; then
              echo "::error::unexpected blob for $path: $got != $want"
              exit 1
            fi
          }
          check_object "rust/lance/src/dataset/tests/dataset_scanner_knn.rs" "1c62b04b68d064bde8c56e63c149de959a25cf7d"
          check_object "rust/lance/src/session/index_caches.rs" "154b92c96c7f176b77546715a8d6616a1cb01d94"
          check_object "rust/lance/src/io/exec/knn.rs" "c83d7fce94d0dab6f66c51a7f405cd3eb282ddf3"
          check_object "rust/lance-core/src/cache/mod.rs" "06547ea350e4beeb2bc035f39cdb7fbc4dfb5d15"
          check_object "Cargo.lock" "be54ca4a3271c5ddd2d33e867cb4ac3c16660d52"
          check_object "rust/lance/Cargo.toml" "a4c2ac1179520c3d3cfdd26ff1342747392e53e3"
          check_object "$COMMIT_PATH" "518f98579269ff97e1966bc7905df84d5e9036ca"

          echo "toolchain_pin=$(grep -m1 '^channel' rust-toolchain.toml)"

          # Probe patch oracle: extract the patch from the PR-head object and
          # check the reviewed bytes before touching the reproduction worktree.
          # Both patch copies live next to (not inside) the reproduction
          # checkout.
          PATCH_BLOB=$(git -C "$DIAG" rev-parse "HEAD:$PATCH_BLOB_PATH")
          git -C "$DIAG" cat-file blob "$PATCH_BLOB" > "$PATCH"
          PATCH_SHA=$(sha256sum "$PATCH" | cut -d' ' -f1)
          echo "patch_blob=$PATCH_BLOB"
          echo "patch_sha256=$PATCH_SHA"
          if [ "$PATCH_SHA" != "60ba37148bb5ef10461495600809baa263e314a8526f64c9773deb53a3d5f2d9" ]; then
            echo "::error::patch oracle mismatch: $PATCH_SHA"
            exit 1
          fi

          # Repair patch oracle: same treatment, plus a shape check. The only
          # file it may touch is the production commit handler; a test hunk
          # would be a substitute for the repair and must not enter this run.
          REPAIR_PATCH_BLOB=$(git -C "$DIAG" rev-parse "HEAD:$REPAIR_PATCH_BLOB_PATH")
          git -C "$DIAG" cat-file blob "$REPAIR_PATCH_BLOB" > "$REPAIR_PATCH"
          REPAIR_PATCH_SHA=$(sha256sum "$REPAIR_PATCH" | cut -d' ' -f1)
          echo "repair_patch_blob=$REPAIR_PATCH_BLOB"
          echo "repair_patch_sha256=$REPAIR_PATCH_SHA"
          if [ "$REPAIR_PATCH_SHA" != "dbc549f2adafaa1766f23c093b455547f0af71ab4fc325cd4427732bd05ab606" ]; then
            echo "::error::repair patch oracle mismatch: $REPAIR_PATCH_SHA"
            exit 1
          fi
          REPAIR_NUMSTAT=$(git apply --numstat "$REPAIR_PATCH")
          echo "repair_patch_numstat=$REPAIR_NUMSTAT"
          if [ "$REPAIR_NUMSTAT" != $'8\t1\t'"$COMMIT_PATH" ]; then
            echo "::error::repair patch touches an unexpected path: $REPAIR_NUMSTAT"
            exit 1
          fi
          if grep -q '^diff --git a/rust/lance/src/' "$REPAIR_PATCH"; then
            echo "::error::repair patch contains a test-side hunk"
            exit 1
          fi

          # Materialize the committed blob for each patched path. A Windows
          # checkout can leave CRLF bytes in the worktree, and `git checkout --`
          # may skip a path whose index stat data still says it is up to date.
          # cat-file writes the exact HEAD bytes without smudge/eol filters.
          # Nothing here is pushed or committed.
          git config --local core.autocrlf false
          for path in "${MATERIALIZE_PATHS[@]}"; do
            blob=$(git rev-parse "HEAD:$path")
            git cat-file blob "$blob" > "$path"
          done
          PRE=$(git hash-object --no-filters "$TEST_PATH")
          echo "pre_apply_worktree_blob=$TEST_PATH sha=$PRE"
          if [ "$PRE" != "1c62b04b68d064bde8c56e63c149de959a25cf7d" ]; then
            echo "::error::reproduction worktree is not the red test source: $PRE"
            exit 1
          fi
          PRE_COMMIT=$(git hash-object --no-filters "$COMMIT_PATH")
          echo "pre_apply_worktree_blob=$COMMIT_PATH sha=$PRE_COMMIT"
          if [ "$PRE_COMMIT" != "518f98579269ff97e1966bc7905df84d5e9036ca" ]; then
            echo "::error::reproduction worktree is not the red commit handler: $PRE_COMMIT"
            exit 1
          fi

          if ! git apply --check "$PATCH"; then
            echo "::error::identity patch does not apply to the red head"
            exit 1
          fi
          if ! git apply "$PATCH"; then
            echo "::error::identity patch failed to apply"
            exit 1
          fi
          check_post() {
            local path="$1" want="$2" got
            got=$(git hash-object --no-filters "$path")
            echo "post_apply_worktree_blob=$path sha=$got"
            if [ "$got" != "$want" ]; then
              echo "::error::unexpected post-patch blob for $path: $got != $want"
              exit 1
            fi
          }
          check_post "$TEST_PATH" "7ec24ee2f09dcdbf1dce19f2b200846f362ec3c7"
          check_post "$KNN_PATH" "a41b564fd1cf9df325fa64f1281b1e2cfabb0531"
          check_post "$INDEX_CACHE_PATH" "e34e3bedf80877433a2a74b074b8420b3906cbd6"

          # The post-patch blob already pins every byte; these greps are a
          # readable cross-check that the 11 phase emissions and the original
          # residency/correctness assertions survived.
          for label in \
            original_miss original_hit delete_miss delete_hit \
            optimize_miss reindex_miss checkout_original_hit \
            'compact_{target_rows_per_fragment}_miss' \
            'compact_{target_rows_per_fragment}_hit'
          do
            if ! grep -qF "$label" "$TEST_PATH"; then
              echo "::error::missing phase label: $label"
              exit 1
            fi
          done
          for assertion in \
            'after.loads_started, before.loads_started' \
            'after.loads_succeeded > before.loads_succeeded' \
            'assert_eq!(after.hits, before.hits' \
            'LanceCache::no_cache()'
          do
            if ! grep -qF "$assertion" "$TEST_PATH"; then
              echo "::error::missing preserved assertion: $assertion"
              exit 1
            fi
          done
          echo "phase_labels=9_sites_11_phases assertions_preserved=ok"
          check_marker() {
            local path="$1" marker="$2"
            if ! grep -qF "$marker" "$path"; then
              echo "::error::missing diagnostic marker $marker in $path"
              exit 1
            fi
          }
          check_marker "$INDEX_CACHE_PATH" "qrf_identity"
          check_marker "$KNN_PATH" "qrf_lookup"
          check_marker "$KNN_PATH" "peek_resident_with_key"
          check_marker "$TEST_PATH" "refinement_cache_residency"
          echo "identity_probes=base_identity,entry_key,resident_before residency_units=bytes,entries"

          # Apply the production repair after the probe. It must apply to the
          # red blob, leave the probe blobs untouched, and produce exactly the
          # production blob. `git diff --name-only` then proves the build tree
          # is red + probe + repair with no unrelated change.
          if ! git apply --check "$REPAIR_PATCH"; then
            echo "::error::repair patch does not apply to the red head"
            exit 1
          fi
          if ! git apply "$REPAIR_PATCH"; then
            echo "::error::repair patch failed to apply"
            exit 1
          fi
          check_post "$COMMIT_PATH" "4c8e3710ad24a57fb76603a0a4a05bb830e79c08"
          check_post "$TEST_PATH" "7ec24ee2f09dcdbf1dce19f2b200846f362ec3c7"
          check_post "$KNN_PATH" "a41b564fd1cf9df325fa64f1281b1e2cfabb0531"
          check_post "$INDEX_CACHE_PATH" "e34e3bedf80877433a2a74b074b8420b3906cbd6"
          CHANGED=$(git diff --name-only | sort)
          EXPECTED=$(printf '%s\n' "${MATERIALIZE_PATHS[@]}" | sort)
          echo "changed_paths=$(printf '%s ' "$CHANGED")"
          if [ "$CHANGED" != "$EXPECTED" ]; then
            echo "::error::unexpected changed paths: $CHANGED"
            exit 1
          fi
          git diff --stat -- "${MATERIALIZE_PATHS[@]}"
          git diff --numstat -- "${MATERIALIZE_PATHS[@]}"

      - name: Record toolchain
        run: |
          "RUSTUP_TOOLCHAIN=$env:RUSTUP_TOOLCHAIN"
          rustc --version --verbose
          cargo --version
          cargo nextest --version
          protoc --version

      - name: Build tests (workspace, same as nightly)
        run: cargo nextest run --cargo-profile ci --locked --no-run

      - name: Enumerate the three lifecycle selectors before running
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $filter = 'test(/dataset_scanner_knn::test_quantized_refinement_cache_snapshot_lifecycle::/)'
          $raw = cargo nextest list --cargo-profile ci --locked --message-format json -E $filter | Out-String
          if ($LASTEXITCODE -ne 0) { throw "cargo nextest list failed with exit code $LASTEXITCODE" }
          $raw | Set-Content -Path nextest-filtered.json

          $doc = $raw | ConvertFrom-Json
          if (-not $doc.'rust-suites') { throw "nextest list reported no rust-suites (zero tests listed)" }
          $all = @()
          foreach ($suite in $doc.'rust-suites'.PSObject.Properties) {
            foreach ($case in $suite.Value.testcases.PSObject.Properties) {
              $all += $case.Name
            }
          }
          $prefix = 'dataset::tests::dataset_scanner_knn::test_quantized_refinement_cache_snapshot_lifecycle::'
          $listed = @($all | Where-Object { $_.StartsWith($prefix) })
          "listed_total=$($all.Count)"
          "listed_lifecycle=$($listed.Count)"
          $listed | ForEach-Object { "selector=$_" }

          $expected = @(
            'dataset::tests::dataset_scanner_knn::test_quantized_refinement_cache_snapshot_lifecycle::case_1_row_addresses',
            'dataset::tests::dataset_scanner_knn::test_quantized_refinement_cache_snapshot_lifecycle::case_2_stable_row_ids',
            'dataset::tests::dataset_scanner_knn::test_quantized_refinement_cache_snapshot_lifecycle::case_3_deferred_row_addresses'
          )
          if ($listed.Count -ne $expected.Count) {
            throw "expected exactly $($expected.Count) lifecycle selectors, found $($listed.Count)"
          }
          foreach ($leaf in $expected) {
            $hits = @($listed | Where-Object { $_ -eq $leaf -or $_.EndsWith("::$leaf") })
            if ($hits.Count -ne 1) {
              throw "expected selector not uniquely listed: $leaf (matches: $($hits.Count))"
            }
          }
          "selector_assertion=ok expected_count=$($expected.Count)"

      - name: Run the three lifecycle cases (default features, RUST_BACKTRACE=1)
        env:
          RUST_BACKTRACE: "1"
        run: |
          "RUST_BACKTRACE=$env:RUST_BACKTRACE"
          cargo nextest run --cargo-profile ci --locked --no-fail-fast --no-tests=fail --success-output immediate -E 'test(/dataset_scanner_knn::test_quantized_refinement_cache_snapshot_lifecycle::/)'

      - name: Upload selector listing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextest-filtered-listing
          path: reproduction/rust/nextest-filtered.json
          if-no-files-found: warn
