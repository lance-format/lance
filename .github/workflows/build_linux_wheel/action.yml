# We create a composite action to be re-used both for testing and for releasing
name: build-linux-wheel
description: "Build a manylinux wheel for lance"
inputs:
  python-minor-version:
    description: "10, 11, 12, 13"
    required: true
  args:
    description: "--release"
    required: false
    default: ""
  arm-build:
    description: "Build for arm64 instead of x86_64"
    # Note: this does *not* mean the host is arm64, since we might be cross-compiling.
    required: false
    default: "false"
  manylinux:
    description: "The manylinux version to build for"
    required: false
    default: "2_17"
runs:
  using: "composite"
  steps:
    - name: CONFIRM ARM BUILD
      shell: bash
      run: |
        echo "ARM BUILD: ${{ inputs.arm-build }}"
    - name: Clean old wheels
      shell: bash
      run: |
        # Ensure no cached pylance wheels linger across cache restores
        rm -f python/target/wheels/pylance-*.whl || true
    - name: Pull manylinux image
      id: manylinux-image
      shell: bash
      env:
        HOST_ARCH: ${{ runner.arch }}
        ARM_BUILD: ${{ inputs.arm-build }}
        MANYLINUX: ${{ inputs.manylinux }}
      run: |
        # maturin-action pulls its image once with no retry, and skips the pull
        # when the image is already present. The names match its defaults.
        case "${HOST_ARCH}/${ARM_BUILD}/${MANYLINUX}" in
          X64/false/2_17) image="quay.io/pypa/manylinux2014_x86_64:latest" ;;
          X64/false/2_28) image="quay.io/pypa/manylinux_2_28_x86_64:latest" ;;
          ARM64/true/2_17) image="quay.io/pypa/manylinux2014_aarch64:latest" ;;
          ARM64/true/2_28) image="quay.io/pypa/manylinux_2_28_aarch64:latest" ;;
          *)
            echo "No pinned image for ${HOST_ARCH}/${ARM_BUILD}/${MANYLINUX}; maturin-action picks its default"
            exit 0
            ;;
        esac
        for attempt in 1 2 3 4 5; do
          if docker image inspect "${image}" > /dev/null 2>&1 || docker pull "${image}"; then
            echo "image=${image}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if (( attempt < 5 )); then
            sleep "$((attempt * 20))"
          fi
        done
        echo "Failed to pull ${image} after 5 attempts" >&2
        exit 1
    - name: Build x86_64 Manylinux2014 wheel
      if: ${{ inputs.arm-build == 'false' && inputs.manylinux == '2_17' }}
      uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1
      with:
        command: build
        working-directory: python
        target: x86_64-unknown-linux-gnu
        manylinux: ${{ inputs.manylinux }}
        container: ${{ steps.manylinux-image.outputs.image }}
        args: ${{ inputs.args }}
        maturin-version: "1.10.2"
        before-script-linux: |
          set -euo pipefail
          yum install -y openssl-devel
          bash "${GITHUB_WORKSPACE}/.github/workflows/build_linux_wheel/install-protoc.sh"
    - name: Build x86_64 Manylinux {manylinux} wheel
      if: ${{ inputs.arm-build == 'false' && inputs.manylinux != '2_17' }}
      uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1
      with:
        command: build
        working-directory: python
        target: x86_64-unknown-linux-gnu
        manylinux: ${{ inputs.manylinux }}
        container: ${{ steps.manylinux-image.outputs.image }}
        docker-options: |
          -e CC=clang
          -e CXX=clang++
        args: ${{ inputs.args }}
        maturin-version: "1.10.2"
        before-script-linux: |
          set -euo pipefail
          yum install -y openssl-devel clang
          bash "${GITHUB_WORKSPACE}/.github/workflows/build_linux_wheel/install-protoc.sh"
    - name: Build Arm Manylinux Wheel
      if: ${{ inputs.arm-build == 'true' }}
      uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1
      with:
        command: build
        working-directory: python
        target: aarch64-unknown-linux-gnu
        manylinux: ${{ inputs.manylinux }}
        container: ${{ steps.manylinux-image.outputs.image }}
        args: ${{ inputs.args }}
        maturin-version: "1.10.2"
        before-script-linux: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/workflows/build_linux_wheel/install-protoc.sh"
