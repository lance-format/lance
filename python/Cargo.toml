[package]
name = "pylance"
version = "12.0.0-beta.15"
edition = "2024"
authors = ["Lance Devs <dev@lance.org>"]
license = "Apache-2.0"
rust-version = "1.91"
exclude = ["python/lance/conftest.py"]
publish = false

# `python/` is excluded from the top-level workspace (see ../Cargo.toml) and keeps
# its own Cargo.lock. Declaring an empty workspace here makes this crate an explicit
# workspace root, so cargo resolves it standalone even when the checkout is nested
# inside another cargo project (e.g. a git worktree placed under the main checkout).
[workspace]

[lib]
name = "lance"
crate-type = ["cdylib"]

[dependencies]
arrow = { version = "58.0.0", features = ["pyarrow"] }
arrow-array = "58.0.0"
arrow-cast = "58.0.0"
arrow-data = "58.0.0"
arrow-schema = "58.0.0"
object_store = "0.13.2"
url = "2.5.7"
datafusion = { version = "54.0.0", default-features = false }
datafusion-ffi = "54.0.0"
datafusion-common = "54.0.0"
# Keep the Python FFI build on the working Brotli allocator resolution until
# datafusion-ffi no longer enables datafusion-proto/default.
# See https://github.com/lance-format/lance/issues/7271.
alloc-stdlib = "=0.2.2"
async-trait = "0.1"
chrono = "0.4.42"
env_logger = "0.11.7"
futures = "0.3"
half = { version = "2.5", default-features = false, features = [
    "num-traits",
    "std",
] }
lance = { path = "../rust/lance", features = [
    "goosefs",
    "dynamodb",
    "substrait",
    "metrics",
] }
lance-arrow = { path = "../rust/lance-arrow" }
lance-core = { path = "../rust/lance-core" }
lance-datagen = { path = "../rust/lance-datagen", optional = true }
lance-encoding = { path = "../rust/lance-encoding" }
lance-file = { path = "../rust/lance-file" }
lance-index = { path = "../rust/lance-index", features = [
    "tokenizer-lindera",
    "tokenizer-jieba",
] }
lance-io = { path = "../rust/lance-io", features = ["metrics"] }
lance-linalg = { path = "../rust/lance-linalg" }
lance-namespace = { path = "../rust/lance-namespace" }
lance-namespace-impls = { path = "../rust/lance-namespace-impls", features = ["rest", "rest-adapter", "dir-goosefs"] }
lance-table = { path = "../rust/lance-table" }
lance-datafusion = { path = "../rust/lance-datafusion" }
libc = "0.2.176"
log = "0.4"
metrics = "0.24"
metrics-util = "0.19"
prost = "0.14.1"
prost-types = "0.14.1"
pyo3 = { version = "0.28", features = [
    "abi3-py310",
    "py-clone",
    "chrono",
] }
pythonize = "0.28"
tokio = { version = "1.48", features = ["rt-multi-thread"] }
uuid = "1.3.0"
roaring = "0.11.4"
serde_json = "1"
serde = "1.0.197"
serde_yaml = "0.9.34"
tracing-chrome = "0.7.1"
tracing-subscriber = "0.3.17"
tracing = { version = "0.1" }
bytes = "1.11.1"

[features]
default = ["extension-module"]
datagen = ["lance-datagen"]
extension-module = ["pyo3/extension-module"]
fp16kernels = ["lance/fp16kernels"]

[profile.ci]
debug = "line-tables-only"
inherits = "dev"
incremental = false

# This rule applies to every package except workspace members (dependencies
# such as `arrow` and `tokio`). It disables debug info and related features on
# dependencies so their binaries stay smaller, improving cache reuse.
[profile.ci.package."*"]
debug = false
debug-assertions = false
strip = "debuginfo"
incremental = false

[lints.clippy]
disallowed_macros = "deny"
